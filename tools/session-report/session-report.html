\nThere is also a `doc/` tree at repo root (`doc/LuminaFeed Initial Specification.md`, `doc/initial/`, `doc/plans/README.md`) and a `CLAUDE.md`.\n\n**Verdict:** This is the stock **.NET Blazor Web App \"Individual Accounts\" template**, essentially untouched. The only non-template additions are `Components/Pages/Auth.razor` (a trivial `[Authorize]` demo page) and the `doc/` + `CLAUDE.md` planning material. No `Services/`, no domain folders, no `Models/` beyond Identity.\n\n## 2. Program.cs / startup\n\n`LuminaFeed/Program.cs` (69 lines) is the verbatim template. Key registrations:\n\n- **Blazor:** `AddRazorComponents().AddInteractiveServerComponents()` → mapped via `MapRazorComponents&lt;App&gt;().AddInteractiveServerRenderMode()`.\n- **Auth state:** `AddCascadingAuthenticationState()`, `AddScoped&lt;IdentityRedirectManager&gt;()`, `AddScoped&lt;AuthenticationStateProvider, IdentityRevalidatingAuthenticationStateProvider&gt;()`.\n- **Authentication:** `AddAuthentication` with `DefaultScheme = IdentityConstants.ApplicationScheme`, `DefaultSignInScheme = IdentityConstants.ExternalScheme`, then `.AddIdentityCookies()`.\n- **DbContext:** connection string `\"DefaultConnection\"` → `AddDbContext&lt;ApplicationDbContext&gt;(o =&gt; o.UseSqlite(connectionString))`; plus `AddDatabaseDeveloperPageExceptionFilter()`.\n- **Identity:** `AddIdentityCore&lt;ApplicationUser&gt;(o =&gt; { o.SignIn.RequireConfirmedAccount = true; o.Stores.SchemaVersion = IdentitySchemaVersions.Version3; }).AddEntityFrameworkStores&lt;ApplicationDbContext&gt;().AddSignInManager().AddDefaultTokenProviders()`.\n- **Email:** `AddSingleton&lt;IEmailSender&lt;ApplicationUser&gt;, IdentityNoOpEmailSender&gt;()` — a **no-op** email sender (emails go nowhere).\n- **Middleware:** dev uses `UseMigrationsEndPoint()`; prod uses `UseExceptionHandler(\"/Error\")` + `UseHsts()`. Then `UseStatusCodePagesWithReExecute(\"/not-found\")`, `UseHttpsRedirection()`, `UseAntiforgery()`, `MapStaticAssets()`, and `MapAdditionalIdentityEndpoints()`.\n\nNote: `RequireConfirmedAccount = true` combined with the no-op email sender means registration currently cannot complete a real confirmation flow (the template's `RegisterConfirmation` page shows the link directly in dev).\n\n## 3. Data layer\n\n- **`Data/ApplicationDbContext.cs`** — primary-constructor class deriving from `IdentityDbContext&lt;ApplicationUser&gt;`. **Empty body, no custom DbSets.** Only the Identity tables exist.\n- **`Data/ApplicationUser.cs`** — `public class ApplicationUser : IdentityUser {}`. **Empty — NOT extended.** No `isAdmin` flag despite the spec calling for one.\n- **`Data/Migrations/`** — exactly **one** migration: `00000000000000_CreateIdentitySchema` (the template's fixed-timestamp Identity schema). It creates only the standard Identity tables: `AspNetRoles`, `AspNetUsers`, `AspNetRoleClaims`, `AspNetUserClaims`, `AspNetUserLogins`, `AspNetUserPasskeys`, `AspNetUserRoles`, `AspNetUserTokens`. No domain tables. `ApplicationDbContextModelSnapshot.cs` matches. A physical `app.db` (with WAL/SHM) is present and copied to output (`CopyToOutputDirectory=\"PreserveNewest\"`).\n\n## 4. Identity / auth\n\nEverything under `Components/Account/` is the **default .NET 10 Identity Razor component scaffold**, complete and unmodified — including modern extras: **passkeys/WebAuthn** (`Passkeys.razor`, `PasskeySubmit.razor(.js)`, `PasskeyInputModel.cs`, `PasskeyOperation.cs`), 2FA (authenticator, recovery codes, disable), external logins, email/password management, personal-data export/delete. Endpoints are wired through `IdentityComponentsEndpointRouteBuilderExtensions.MapAdditionalIdentityEndpoints`. Auth mode is cookie-based ASP.NET Core Identity with a revalidating server-side `AuthenticationStateProvider`.\n\n## 5. Blazor render mode\n\n**Blazor Server — Interactive Server (SSR + InteractiveServer), no WebAssembly, no Auto.**\n- `Program.cs`: `AddInteractiveServerComponents()` / `AddInteractiveServerRenderMode()` only.\n Seed a bootstrap admin user; drop stale app.db csproj item\n```\nNote the commit order is NOT the G0.x numeric order (G0.5 and G0.R and G0.6 landed before G0.3/G0.4). Dependencies still hold (G0.6 needs only G0.5). The final commit `cf264dc` (admin user seed) is an addition not covered by any G0.x plan — see inconsistencies.\n\n---\n\n## 1. Initial Specification — `doc/LuminaFeed Initial Specification.md`\n\nDurable requirements (the behavioural source of truth):\n\n**Domain model / roles**\n- Users: standard vs admin differentiated by a simple `isAdmin` flag on the user table. Non-logged-in users treated as subscribed-to-nothing.\n- Categories: a dedicated entity; feeds pick a category from a dropdown. Seed list is illustrative (World News, Markets, Weather, Breaking News, etc.) — later superseded by G0.R.\n- Feeds: admin-curated, categorized, each with an image.\n\n**Admin capabilities** — views to: list signed-up users + their feeds; edit categories; CRUD feeds (add/delete); remove specific subscriptions from users or delete user registrations.\n\n**Public main view** — feeds by category; max 5 entries per category (single row desktop, wrap on mobile); a **more** button loads +5. Ordering within a category defaults to **popularity**, with a header order button also allowing name asc/desc. Category filter at page root: filtered view caps at **30** items, another more adds +30. Feeds shown as **cards** with image if available; each card has two buttons, one leading to the feed's page.\n\n**Feed page** — different card type showing article image, first few paragraphs, title (all subject to data availability); a subscribe button at top unless already subscribed.\n\n**Subscribe/unsubscribe flow** — unauthenticated subscribe → login page (offers register), **preserving original location via query param** for return. If signed-in &amp; already subscribed, button shows **unsubscribe in red**.\n\n**Subscribe dialog** — two switches (email + Slack). Email works out of the box (registered address); alternate/extra emails **out of scope** (needs verification link). Slack: single webhook sufficient; input shown when toggled; prefilled from user's last webhook (`LastOrDefault`); must validate URL begins `https://hooks.slack.com/services`; default channel, so no channel field.\n\n**Notifications architecture** — `INotificationService` with `EmailNotificationService` + `SlackNotificationService`, invoke either/both. **Slack.Webhooks** NuGet for Slack; **MailKit** for email (and for the registration `EmailSender`).\n\n**Email config &amp; templates** — `appsettings.Development.json` pre-populated with **Papercut** localhost SMTP. Templates must be **table-based (not div-based)** for Word-based Outlook; buttons **duplicated** so they look right in Outlook, duplicates shown only for Outlook.\n\n**Feed polling** — background task polls every minute (configurable in appsettings). RSS service tracks all feeds with ≥1 subscriber. Each poll iterates active feeds, uses **ETag** and **Last-Modified** to allow **304 Not Modified**. Returns a dictionary keyed by user email → list of articles; background service dispatches to notification services per user choice.\n\n**Unsubscribe** — `EmailNotificationService` implements **HMAC-signed token-based unsubscribe conforming to RFC 8058**. A simple page with a single unsubscribe button per feed via an Unsubscribe link. Must allow unsubscribing from one channel or both.\n\n**Technical convention** — all new entities use **v7 GUIDs** as IDs.\n\n(There is a duplicate copy at `doc/initial/4 LuminaFeed Initial Specification.md` plus transcription drafts in `doc/initial/`.)\n\n---\n\n## 2. Master Plan — `doc/plans/00-master-plan.md`\n\nFramed as an ordered roadmap, not an implementation plan. Only items marked 🗂 get their own detailed plan file. Greenfield on the stock **.NET 10 Blazor Web App (Individual Accounts)**, Interactive Server, Identity fully scaffolded, email a no-op sender, `RequireConfirmedAccount = issing-only, idempotent); startup runs `MigrateAsync` + seed (⚠️ auto-migrate flagged as temporary, not production-ready). `[x]`\n\nParallelization: G0.R first/gating; then `G0.1 → {G0.2, G0.3, G0.5}`; G0.4 after G0.3; G0.6 after G0.5; G0.7 once G0.3 done.\n\n### After Phase 0:\n- **Phase 1 — Walking skeleton (all `[ ]` unchecked):** S1 admin create category+feed (minimal); S2 public minimal feed list (card, no ordering/filter/pagination); S3 subscribe email-only (no dialog/Slack/redirect polish); S4 minimal polling (persist Articles); S5 minimal email notification (plain new-article email). DoD: admin adds feed → appears publicly → user subscribes → polling fetches → user gets email.\n- **Phase 2 — Broaden (all `[ ]`, all 🗂):** Track A (Admin) A1 Category CRUD, A2 Feed CRUD, A3 User management; Track B (Public UX) B1 feed list by category (5/cat, +5 more), B2 ordering control, B3 category filter (cap 30, +30), B4 feed detail page; Track C (Subs/notifications) C1 full subscribe flow, C2 Slack notifications, C3 email hardening (Outlook templates), C4 polling hardening (≥1-subscriber tracking, ETag/304, image resolution incl. og:image scrape, email→articles dict, dispatch per channel), C5 unsubscribe (RFC 8058, List-Unsubscribe headers).\n\n**Decided:** Popularity is a fixed figure (not computed), from G0.R, default sort. Categories from research, not spec examples. Images use RSS-provided else scraped `og:image`, no admin upload, store URL not blob.\n\n**Open decisions:** more/pagination mechanics (constraint: avoid full page reload, use InteractiveServer partial/enhanced nav; resolved in B1); article identity/de-dup for polling; HMAC key management/rotation; confirmation UX with a real sender.\n\n**Deferred / out of scope:** alternate/multiple email addresses; multiple Slack channels (single webhook v1); categories as free-text (superseded by entity); **admin image upload** (this session).\n\n---\n\n## 3. Individual plan files in `doc/plans/`\n\nOnly **three** G0 tasks have detailed plans — exactly the 🗂 items. There are **no** G0.1, G0.2, G0.4, G0.5, G0.6 plan files (consistent with \"only 🗂 gets a plan\"). `README.md` just states plans live here, one per file.\n\n### `G0.R-rss-feed-research.md`\nPlan + outcome. Three artifacts flow downstream: category set (replaces spec's illustrative list), curated feed list, fixed popularity per feed. Consumers: **G0.3** (field-name alignment) and **G0.7** (seeder reads JSON). Data keys categories by name; feeds reference category by name (no hardcoded GUIDs — GUID v7 generated at seed time). Deliverables: `rss-feeds.json` (canonical, source of truth) and `rss-feeds.md` (companion with verification evidence). JSON shape: `{ generatedOn, categories[], feeds[] }`; feed fields `name`, `category`, `feedUrl`, `siteUrl`, `imageUrl` (nullable), `description`, `popularity` (distinct fixed int). Approach: 10 categories, live PowerShell probe with browser UA, keep only HTTP 200 that parse as RSS/Atom/RDF with ≥1 item; capture ETag/Last-Modified for C4; resolve feed image (RSS image/Atom logo → og:image → null); drop 403/406/429/202/non-feed; assign globally-unique popularity. **Outcome: COMPLETE** — 115 feeds / 10 categories (World News 11, Breaking News 9, Politics 7, Business &amp; Markets 10, Technology 36, Science 12, Health 7, Sports 7, Entertainment &amp; Culture 11, Weather 5); 101/115 resolved a feed image. Scale deliberately exercises UI: most categories exceed 5-card display (+5 more); Technology=36 exceeds the 30-cap filter (+30 more). Notes for G0.3 (exact field names, keep `ImageUrl` nullable — 14 feeds have none) and G0.7 (deserialize, upsert categories then feeds, GUID v7 at insert). Weather has only 5 feeds — accepted (RSS scarce).\n\n### `G0.3-domain-model.md`\nSchema only; seed separate (G0.7). Field names aligned 1:1 with G0.R.\n**Scope:** extend `ApplicationUser` with `IsAdmin`; add `Category`, `Feed`, `Subscription`, `Article` sharing a GUID-v7 `EntityBase`; DbSets + `IEntityTypeConfiguration`s; initial migration; unit tests.\n**Out of scope:** seeding (G0.7), admin authz (G0.4), any UI/services, actual polling/notifications.\n**GUID v7:** `EntityBase.Id = Guid.CreateVersion7()`; EF `ValueGeneratedNever()`. `ApplicationUser` stays on Identity's string key (re-keying out of scope); `Subscription.UserId` is a string FK.\n**Entities (full field tables):**\n- `Category`: Id(v7), Name (required, **unique index**, max 100), Description (nullable), Feeds nav.\n- `Feed`: Id, Name (req, max 200), CategoryId FK, Category nav, FeedUrl (req, **unique index**, max 2048), SiteUrl (req, max 2048), ImageUrl (nullable, max 2048), Description (nullable, max 1000), Popularity (int, default sort), plus **three polling-cache columns added now** — ETag (nullable), LastModified (nullable string, raw HTTP), LastPolledAt (`DateTimeOffset?`) — all populated later by C4; Subscriptions + Articles navs.\n- `Subscription`: Id, UserId (string FK), FeedId FK, EmailEnabled, SlackEnabled, SlackWebhookUrl (nullable), CreatedAt (default UtcNow), **unique index (UserId, FeedId)**.\n- `Article`: Id, FeedId FK, ExternalId (RSS guid or fallback link), Title (req, max 500), Link (max 2048), Summary (nullable), ImageUrl (nullable), PublishedAt (nullable), FetchedAt (default UtcNow), **unique index (FeedId, ExternalId)** for de-dup.\n**Persistence:** DbSets; `base.OnModelCreating` then `ApplyConfigurationsFromAssembly`; one config per entity in `Data/Configurations/`. Delete behaviour: Feed→Category **Restrict**; Subscription→Feed **Cascade**; Subscription→User **Cascade**; Article→Feed **Cascade**. Migration `AddDomainModel`; do not apply to checked-in app.db here.\n**Tests:** SQLite in-memory + `EnsureCreated()`: v7 id check, round-trip with navs, unique-index violation throws (both), cascade deletes and Restrict block.\n**Verification:** clean build (0 warnings), green tests, `migrations list` shows `AddDomainModel`.\n**Decisions to confirm:** (1) include the 3 polling-cache columns now (recommended, avoids 2nd migration) — resolves ahead of C4; (2) adopt `Article.ExternalId` + unique index now — resolves master plan's open article-identity question at schema level; (3) `Description` nullable on Category and Feed.\n\n### `G0.7-seed-data.md`\nLast Phase-0 task. Loads G0.R JSON (10 cat, 115 feeds) into DB. Entity fields map 1:1, so seeding is a straight projection. Notes current state: `ApplicationDbContext` exposes the four DbSets; Category.Name + Feed.FeedUrl unique; **Program.cs does not apply migrations at startup**; `InternalsVisibleTo(\"LuminaFeed.Tests\")` set (seeder can be internal); tests use SQLite in-memory.\n**Approach:** embed the research JSON as an EmbeddedResource (link `..\\doc\\research\\rss-feeds.json` → `Data\\Seed\\rss-feeds.json`), resolve by manifest-name suffix; parse to internal DTOs (`SeedCatalog`/`SeedCategory`/`SeedFeed`, System.Text.Json, case-insensitive, ignore unknown like `generatedOn`); loader `Parse(Stream/string)` + `LoadEmbedded()`; `DatabaseSeeder.SeedAsync` upserts by natural key (Category by Name, Feed by FeedUrl), **insert-missing-only / idempotent**, logs counts; startup wiring registers seeder, then `await db.Database.MigrateAsync()` then `SeedAsync` in **all environments**.\n**Tests (`SeedDataTests.cs`):** catalog integrity (C# port of research `verify.ps1` — Categories==10, Feeds==115, referential integrity, distinct popularity + FeedUrls, non-empty required fields); populates DB (top-popularity feed is BBC); idempotent (twice = unchanged); preserves existing edits (pre-inserted row with changed Name/Popularity untouched); adds newcomers after partial seed.\n**Docs:** add `doc/features/seed-data.md`.\n**Verification:** clean build, green tests, run app on fresh DB → logs \"seeded 10 categories, 115 feeds\", re-run logs 0 added; then mark G0.7 done → Phase 0 complete.\n**Decisions:** (1) **auto-apply migrations at startup in all environments — CHOSEN, ⚠️ explicitly not production-ready** (no review gate, race conditions, no rollback), must be flagged in code comment + feature doc as temporary; (2) insert-missing-only (protect admin edits) over refresh-from-research; (3) embed via linked file over copying JSON.\n\n---\n\n## 4. `doc/features/` — one file: `seed-data.md`\n\nDocuments the G0.7 seed feature. Source of truth = embedded `rss-feeds.json` (10 cat, 115 feeds); refresh by editing JSON + rebuild. Components in `LuminaFeed/Data/Seed/`: DTOs, `SeedCatalogLoader` (pure `Parse` + `LoadEmbedded` by filename suffix), `DatabaseSeeder`. Behaviour: upsert by natural key, insert-missing-only, idempotent, resolves CategoryId (missing category → log+skip), GUID v7 client-side.\n\n**Notably documents an `AdminUserSeeder` NOT present in the G0.7 plan:** a bootstrap admin from optional **`AdminSeed`** config (`AdminSeedOptions`) — runs only when both `AdminSeed:Email` and `AdminSeed:Password` set (safe by default; no admin unless configured); `appsettings.Development.json` supplies `admin@luminafeed.local`, base `appsettings.json` empty; production supplies out of source control. Idempotent: creates user with `EmailConfirmed=true` (works under `RequireConfirmedAccount`), promotes existing user, else no-op. Startup order: `MigrateAsync()` → `DatabaseSeeder.SeedAsync()` → `AdminUserSeeder.SeedAsync()`, all environments. Repeats the ⚠️ not-production-ready auto-migrate warning. Tests: `SeedDataTests.cs` + `AdminUserSeederTests.cs` (create-when-configured, skip-when-unconfigured, promote existing, idempotency).\n\nThis corresponds to the final commit `cf264dc` and is scope beyond what any G0.x plan describes.\n\n---\n\n## 5. `doc/research/rss-feeds.md` + `rss-feeds.json` structure\n\n`rss-feeds.md` (generated 2026-09-21) is the human companion to the canonical JSON. Purpose: deliverable for G0.R. Methodology as in the plan (sourced publisher endpoints; live-validated with browser UA; HTTP 200 + parses RSS/Atom/RDF with ≥1 item; captured ETag/Last-Modified for C4; resolved feed image RSS→og:image→null; unique fixed popularity; dropped 403/406/429/202/non-feed).\n\nContents: category table with counts+descriptions (10 categories, **115 total**); per-category feed tables (Feed, Popularity, Feed URL, Image Y/—); a full **verification-evidence table** (every feed: Category, Status 200, ETag Y/N, Last-Modified Y/N, Item image, Feed image, all validated 2026-09-21); coverage summary: **70/115** advertise ETag and/or Last-Modified; **101/115** resolved a feed image.\n\n`rss-feeds.json` structure: top-level object `{ \"generatedOn\": \"2026-09-21\", \"categories\": [ {name, description} × 10 ], \"feeds\": [ {name, category, feedUrl, siteUrl, imageUrl, description, popularity} × 115 ] }`. `&amp;` is JSON-escaped `\\u0026` (e.g. \"Business \\u0026 Markets\", \"Entertainment \\u0026 Culture\"). Some `imageUrl` values are null. Field names map 1:1 to the `Feed`/`Category` domain entities.\n\n---\n\n## Inconsistencies &amp; flags\n\n1. **AdminUserSeeder / `AdminSeed` options are undocumented in any plan.** `doc/features/seed-data.md` describes a bootstrap admin seeder and an `AdminSeed`/`AdminSeedOptions` config section, delivered in commit `cf264dc`. Neither the master plan nor `G0.7-seed-data.md` nor `G0.5` (config) mentions it. G0.7's plan startup wiring lists only `MigrateAsync` + `DatabaseSeeder.SeedAsync`, whereas the feature doc adds a third `AdminUserSeeder.SeedAsync` step. This is scope added beyond the written Phase-0 plans — worth verifying against the actual code. (Arguably it fills a gap: G0.4 created the Admin policy but nothing in the plans seeds an admin to exercise it.)\n\n2. **Config `AdminSeed` section vs G0.5.** G0.5 (config &amp; options) per the master plan covers only Papercut SMTP, polling interval, and HMAC unsubscribe secret. `AdminSeedOptions` is an additional typed-options section surfacing in the seed feature doc — check whether it was actually added under G0.5's commit (`74c8bd8`) or later.\n\n3. **No detailed plan files for G0.1, G0.2, G0.4, G0.5, G0.6.** Consistent with the \"only 🗂 items get a plan\" rule (only G0.R/G0.3/G0.7 are 🗂), but it means five of the eight Phase-0 tasks have no acceptance criteria in `doc/plans/` — the only spec for them is the one-line master-plan bullet. Verifying those (packages present, folders exist, Admin policy, config options + startup validation, MailKit sender + Outlook-safe layout) requires reading code, not docs.\n\n4. **Commit order ≠ dependency order.** G0.5, G0.R, and G0.6 were committed before G0.3/G0.4 (`225995c` G0.6 predates `c4c5f5e` G0.3). The stated dependencies still hold (G0.6 needs only G0.5), so this is benign, but note the master plan lists them G0.1→G0.7 sequentially.\n\n5. **Migration application: plan divergence resolved in G0.7.** G0.3 plan explicitly says *do not* apply the migration to the checked-in app.db; G0.7 then removes reliance on the dev migrations endpoint and auto-applies via `MigrateAsync` at startup in all environments. Both docs flag this as a deliberate, non-production-ready shortcut. `app.db` was untracked mid-phase (`c1491bd` \"Stop tracking generated app.db\"; `cf264dc` \"drop stale app.db csproj item\").\n\n6. **Polling-cache columns and Article de-dup were pulled forward into G0.3** (ETag/LastModified/LastPolledAt on Feed; ExternalId + unique index on Article), pre-resolving two of the master plan's \"open decisions\" (article identity/de-dup) at the schema level, even though polling itself is Phase 2 (C4). Not a contradiction, but the master plan's Open-decisions list still lists \"Article identity/de-dup\" as unresolved while G0.3 already decided it.\n\n7. **Spec vs plans — categories deliberately replaced.** The spec's illustrative categories (World News/Markets/Weather/Breaking News) are intentionally superseded by the 10 researched categories. Note the spec example \"Markets\" became \"Business &amp; Markets\", and all four spec examples do appear (World News, Breaking News, Weather present; Markets folded into Business &amp; Markets) — consistent, just renamed/expanded.\n\n8. **Spec behaviours entirely deferred past Phase 0** (so the last 11 commits should NOT contain them): the whole subscribe/notification/polling/unsubscribe UI and services, ordering/filter/pagination, feed detail page, admin CRUD UIs. Phase 0 delivers only groundwork: packages, folders, domain schema+migration, admin authz policy, config/options, MailKit email infra, and seed data. Any of those app behaviours appearing (or missing groundwork) is the gap to check against implementation.<\/result>\n<usage><subagent_tokens>58589<\/subagent_tokens><tool_uses>12<\/tool_uses><duration_ms>159615<\/duration_ms><\/usage>\n<\/task-notification>"}, {"kind": "response", "ts": "2026-09-21T20:24:55.642Z", "text": "Documentation review complete. Waiting for the two code-exploration agents to finish before synthesizing.", "thinking": "", "tools": []}, {"kind": "prompt", "cls": "typed", "ts": "2026-09-21T20:25:06.847Z", "text": "<task-notification>\n<task-id>ac9b36aba06b7c2ac<\/task-id>\n<tool-use-id>toolu_01GUTPrDjJB6twmTmsbppAPu<\/tool-use-id>\n<output-file>C:\\Users\\thevi\\AppData\\Local\\Temp\\claude\\D--Work-Sonrisa-LuminaFeed\\30657923-1fd5-4c32-87bf-2485b12d155c\\tasks\\ac9b36aba06b7c2ac.output<\/output-file>\n<status>completed<\/status>\n<summary>Agent \"Explore email, auth, config wiring, tests\" finished<\/summary>\n<note>A task-notification fires each time this agent stops with no live background children of its own. The user can send it another message and resume it, so the same task-id may notify more than once.<\/note>\n<result>I have everything needed. Here is the full architecture review.\n\n# LuminaFeed — Senior Architecture Review (READ-ONLY)\n\n## 1. Email infrastructure — `LuminaFeed/Services/Email/`\n\n**`IMailSender.cs`** — Minimal transport abstraction. Single method `Task SendAsync(EmailMessage message, CancellationToken cancellationToken = default)`. Well-documented: low-level transport, higher-level senders delegate here.\n\n**`EmailMessage.cs`** — Immutable `sealed record EmailMessage(string ToEmail, string? ToName, string Subject, string HtmlBody, string? TextBody = null)`. Clean value object.\n\n**`MailKitMailSender.cs`** — `sealed`, primary-constructor DI of `IOptions&lt;SmtpOptions&gt;` + `ILogger`. Snapshots `options.Value` in a field (so it won't pick up `IOptionsMonitor` changes — acceptable as singleton).\n- MailKit usage: creates a **fresh `SmtpClient` per send** via `using var client = new SmtpClient();` (correct — SmtpClient is not reusable/thread-safe). Chooses `SecureSocketOptions.StartTls` vs `.None` from `UseStartTls`. `ConnectAsync` → conditional `AuthenticateAsync` (only when `UserName` non-empty, passing `Password ?? string.Empty`) → `SendAsync` → `DisconnectAsync(quit: true, ...)`.\n- `BuildMessage` is `internal` (exposed to tests via `InternalsVisibleTo`); builds `MimeMessage` with `MailboxAddress` from/to and a `BodyBuilder { HtmlBody, TextBody }`.\n- **Disposal:** `using var client` disposes correctly — but `SmtpClient` is not `await using` and `DisposeAsync` is not used; disposal here is synchronous. Since `DisconnectAsync(quit:true)` runs first, this is acceptable, though `await using` would be more correct for the async client.\n- **Error handling: NONE.** No try/catch. Any SMTP failure (connect/auth/send) propagates raw. For Identity flows this bubbles up into the account UI; for future article notifications a single failed recipient would abort a batch. The success `LogInformation` only runs on the happy path; there is no error logging in this class.\n- **`ConfigureAwait(false)` is missing on every await** (lines 24, 28, 31, 32). This is library/infrastructure code with no need for the sync context — a legitimate flag, though in ASP.NET Core (no sync context) the practical impact is low.\n\n**`EmailLayout.cs`** — `static` class, `BrandColor = \"#0d6efd\"` const.\n- `Render(heading, bodyHtml)` uses a C# raw-string interpolation (`$$\"\"\"...\"\"\"`) to build a full table-based HTML shell: outer 100%-width presentation table, centered 600px inner table with `border-radius`, heading row, body row, and a footer table (\"LuminaFeed\"). Declares the VML/office XML namespaces on `&lt;html&gt;` and an MSO-conditional `&lt;style&gt;` for Outlook fonts. No `&lt;div&gt;` anywhere (verified by test).\n- `Button(text, url)` implements the **\"bulletproof\" duplicated button**: an `&lt;!--[if mso]&gt;` block renders a `v:roundrect` VML button with `&lt;w:anchorlock/&gt;` and a `&lt;center&gt;`; an `&lt;!--[if !mso]&gt;&lt;!--&gt;` block renders a normal styled `&lt;a&gt;`. The two are mutually exclusive via Outlook conditional comments, so the Outlook duplicate never shows in other clients.\n- **Note:** `heading`, `bodyHtml`, `text`, and especially `url` are interpolated raw with **no HTML/URL encoding**. Callers pass Identity-generated confirmation/reset links (already URL-safe) so it is safe today, but this is an injection footgun if any user-controlled string ever flows through (e.g. future article titles/links). Worth flagging.\n\n**`IdentityEmailSender.cs`** — `sealed`, implements `IEmailSender&lt;ApplicationUser&gt;`, DI of `IMailSender`. Three methods: `SendConfirmationLinkAsync`, `SendPasswordResetLinkAsync` (both use `EmailLayout.Render` + `EmailLayout.Button` + a fallback copy/paste link paragraph), and `SendPasswordResetCodeAsync` (renders the code inline, no button). Each returns `mailSender.SendAsync(...)` directly (no `await`, so no `ConfigureAwait` needed here — fine). Replaces the template no-op sender. Note it passes `user.UserName` as the `ToName`.\n\n## 2. Authorization — `LuminaFeed/Authorization/`\n\n**`AdminAuthorization.cs`** — `static` central definition: `PolicyName = \"Admin\"`, `ClaimType = \"IsAdmin\"`, `ClaimValue = \"true\"`. `ClaimsFor(ApplicationUser user)` returns `[new Claim(\"IsAdmin\",\"true\")]` when `user.IsAdmin`, else empty. Clean single source of truth.\n\n**`AdminClaimsPrincipalFactory.cs`** — `sealed`, extends `UserClaimsPrincipalFactory&lt;ApplicationUser&gt;`. Overrides `GenerateClaimsAsync`: calls base, then `identity.AddClaims(AdminAuthorization.ClaimsFor(user))`. This bakes the admin flag into the cookie principal, avoiding a DB hit per authorization check. **Trade-off (worth flagging):** because the claim is baked into the issued cookie, revoking admin (`IsAdmin=false`) does not take effect until the principal is regenerated/re-login — there is no security-stamp revalidation of this custom claim.\n\nPolicy is wired in `Program.cs` (lines 47–49) via `AddAuthorizationBuilder().AddPolicy(\"Admin\", policy =&gt; policy.RequireClaim(\"IsAdmin\",\"true\"))`, and the factory registered at line 45 via `.AddClaimsPrincipalFactory&lt;AdminClaimsPrincipalFactory&gt;()`.\n\n## 3. `Program.cs` (full)\n\nRegistration order:\n1. Razor Components + interactive server components (15–16).\n2. Cascading auth state, `IdentityRedirectManager` (scoped), `IdentityRevalidatingAuthenticationStateProvider` as `AuthenticationStateProvider` (18–20).\n3. Authentication: default scheme `ApplicationScheme`, sign-in scheme `ExternalScheme`, `.AddIdentityCookies()` (22–27).\n4. Connection string from `DefaultConnection` or throw; **`AddDbContext&lt;ApplicationDbContext&gt;` using SQLite** (29–32). DbContext is scoped (default).\n5. `AddDatabaseDeveloperPageExceptionFilter`; `DatabaseSeeder` + `AdminUserSeeder` scoped (33–35).\n6. `AddIdentityCore&lt;ApplicationUser&gt;` with `RequireConfirmedAccount = true`, `Stores.SchemaVersion = Version3`; `.AddEntityFrameworkStores` + `.AddSignInManager` + `.AddDefaultTokenProviders` + `.AddClaimsPrincipalFactory&lt;AdminClaimsPrincipalFactory&gt;()` (37–45).\n7. Authorization builder with the \"Admin\" policy (47–49).\n8. **Email DI: both registered as SINGLETON** — `IMailSender → MailKitMailSender` and `IEmailSender&lt;ApplicationUser&gt; → IdentityEmailSender` (52–53). Singleton is fine here (both are stateless; SmtpClient is created per-send).\n9. Options: `SmtpOptions`, `PollingOptions`, `UnsubscribeOptions` each `.Bind(...).ValidateDataAnnotations().ValidateOnStart()` (56–67). `AdminSeedOptions` bound **without** validation (68–70), by design (empty = no admin).\n\nPipeline / startup:\n- Startup scope (77–83): `await Database.MigrateAsync()`, then `DatabaseSeeder.SeedAsync(ApplicationStopping)`, then `AdminUserSeeder.SeedAsync()`. All awaited (top-level async `Main`) — **no blocking `.Result`/`.Wait()`**. A code comment flags auto-migrate-on-startup as a deliberate non-production shortcut (races, no rollback).\n- Dev: `UseMigrationsEndPoint()`; non-dev: `UseExceptionHandler(\"/Error\", createScopeForErrors:true)` + `UseHsts()` (86–95).\n- `UseStatusCodePagesWithReExecute(\"/not-found\",...)`, `UseHttpsRedirection`, `UseAntiforgery`, `MapStaticAssets`, `MapRazorComponents&lt;App&gt;().AddInteractiveServerRenderMode()`, `MapAdditionalIdentityEndpoints()`, `app.Run()` (97–109).\n- **Missing:** `UseAuthentication()`/`UseAuthorization()` are not explicitly called — this is normal for the Blazor Identity template (handled by the components/endpoints), so not a defect.\n\n## 4. Configuration\n\n**`appsettings.json`** (base, committed):\n- `ConnectionStrings:DefaultConnection = \"DataSource=Data/app.db;Cache=Shared\"` (SQLite).\n- `Smtp`: `Host:\"\"`, `Port:25`, `FromAddress:\"no-reply@luminafeed.local\"`, `FromName:\"LuminaFeed\"`, `UseStartTls:false`, `UserName:\"\"`, `Password:\"\"`.\n- `Polling:IntervalSeconds = 60`.\n- `Unsubscribe:HmacSecret = \"\"`.\n- `AdminSeed`: `Email:\"\"`, `Password:\"\"`.\n- Note: base `Smtp:Host=\"\"` and `Unsubscribe:HmacSecret=\"\"` would **fail `ValidateOnStart`** if run without the Development overlay — production must supply these via env/secrets or startup throws (arguably intended fail-fast).\n\n**`appsettings.Development.json`** (committed):\n- `Smtp:Host=\"localhost\"`, `Smtp:Port=25` → **Papercut/local SMTP defaults** (no TLS, no auth).\n- `Unsubscribe:HmacSecret = \"dev-only-unsubscribe-hmac-secret-change-me\"`.\n- `AdminSeed:Email=\"admin@luminafeed.local\"`, `AdminSeed:Password=\"ChangeMe!123\"`.\n\n**FINDING — secrets committed:** `git ls-files` confirms **both `appsettings.json` and `appsettings.Development.json` are tracked in git**. The Development file contains a hardcoded admin bootstrap password (`ChangeMe!123`) and a hardcoded unsubscribe HMAC secret. These are dev-only and clearly labelled, and a `UserSecretsId` exists in the csproj (the proper home for them), but committing real credential-shaped values is a flag. If any environment ever loads the Development overlay, the admin account and HMAC secret are publicly known.\n\n## 5. Test suite — `LuminaFeed.Tests/`\n\n| File | Coverage |\n|---|---|\n| `SmokeTests.cs` | Single `Assert.True(true)` placeholder confirming the harness + project reference are wired. No real value. |\n| `DomainModelTests.cs` | Real **in-memory SQLite** (`DataSource=:memory:`, kept-open connection, `EnsureCreated`). Covers: Id is non-empty GUID v7; full graph (User/Category/Feed/Subscription/Article) round-trips with includes; Subscription (UserId,FeedId) unique index throws; Article (FeedId,ExternalId) unique index throws; deleting a Feed cascades to Articles+Subscriptions; deleting a Category with feeds is restricted. Strong. |\n| `OptionsTests.cs` | Binding of Smtp/Polling/Unsubscribe; PollingOptions default 60s + `Interval` computation; DataAnnotations failures (Smtp required fields, Unsubscribe min-length); an **options pipeline** test that mirrors Program.cs registration and asserts `ValidateDataAnnotations` throws `OptionsValidationException` on empty secret. Good — but it rebuilds the pipeline inline rather than testing the real Program.cs wiring, and does not assert `ValidateOnStart`. |\n| `EmailTests.cs` | Three classes: `EmailLayoutTests` (table-based not div-based, VML namespace present, button emits both mso + non-mso variants), `MailKitMailSenderTests` (`BuildMessage` sets From/To/Subject/HtmlBody — via the internal method), `IdentityEmailSenderTests` (a `CapturingMailSender` fake asserts confirmation email builds table HTML containing the link). Note: file is named `EmailTests.cs` but contains no top-level `EmailTests` class. |\n| `AdminAuthorizationTests.cs` | `ClaimsFor` admin vs standard; and end-to-end policy evaluation via a real `IAuthorizationService` (admin claim succeeds, name-only principal fails). Good. |\n| `SeedDataTests.cs` | In-memory SQLite. Embedded catalog integrity (**exactly 10 categories, 115 feeds**, every feed→known category, distinct popularity + distinct URLs, required fields populated); seeds populate DB and resolve categories (BBC is top by popularity); idempotency; does-not-overwrite existing edited feed; adds newcomers after a partial seed. Thorough. |\n| `AdminUserSeederTests.cs` | Real Identity stack over in-memory SQLite. Creates confirmed admin when configured; creates nothing when unconfigured; promotes existing user; idempotent (one user after two runs). Thorough. |\n\n**Testing approach:** xUnit; consistent use of **in-memory SQLite via a kept-open connection** (real EF model + real constraints), which is better than the EF InMemory provider. Fakes (`CapturingMailSender`) and `NullLogger` used for isolation.\n\n**Test gaps:**\n- No test for `MailKitMailSender.SendAsync` transport behavior (no error-handling path exists to test — and none is asserted).\n- No integration/`WebApplicationFactory` test of the actual `Program.cs` DI graph (options pipeline is re-declared inline instead).\n- **No tests for Slack, `INotificationService`, `EmailNotificationService`, or unsubscribe/HMAC** — because none of that code exists yet.\n- `SmokeTests` is dead weight.\n\n## 6. `.csproj` files\n\n**`LuminaFeed.csproj`** — SDK `Microsoft.NET.Sdk.Web`; `TargetFramework net10.0`; `Nullable enable`; `ImplicitUsings enable`; **no explicit `LangVersion`** (defaults to C# 14 for net10.0); `UserSecretsId` present; `BlazorDisableThrowNavigationException`; `DockerDefaultTargetOS Linux`; `InternalsVisibleTo LuminaFeed.Tests`. Packages:\n- `Ardalis.SmartEnum` 8.2.0\n- `ErrorOr` 2.1.1\n- `FluentValidation` 12.1.1 + `FluentValidation.DependencyInjectionExtensions` 12.1.1\n- `MailKit` 4.18.0\n- `Microsoft.AspNetCore.Diagnostics.EntityFrameworkCore` 10.0.12\n- `Microsoft.AspNetCore.Identity.EntityFrameworkCore` 10.0.12\n- `Microsoft.EntityFrameworkCore.Sqlite` 10.0.12\n- `Microsoft.EntityFrameworkCore.Tools` 10.0.12 (private)\n- `Slack.Webhooks` 1.1.6\n- EmbeddedResource: `doc/research/rss-feeds.json` (seed catalogue).\n\n**`LuminaFeed.Tests.csproj`** — SDK `Microsoft.NET.Sdk`; `net10.0`; `Nullable enable`; `ImplicitUsings enable`; `IsPackable false`; no `LangVersion`. Packages: `coverlet.collector` 6.0.4, `Microsoft.NET.Test.Sdk` 17.14.1, `xunit` 2.9.3, `xunit.runner.visualstudio` 3.1.4; global `Using Xunit`; project reference to the app.\n\nAll spec-required packages ARE present (MailKit, Slack.Webhooks, ErrorOr, FluentValidation, Ardalis.SmartEnum, EF Core, xUnit). Note Slack.Webhooks and ErrorOr/FluentValidation/SmartEnum are referenced but **not yet used anywhere in code** (only in domain enums possibly for SmartEnum — see below).\n\n---\n\n## Flagged issues (concrete)\n\n1. **Secrets committed** — `LuminaFeed/appsettings.Development.json` (git-tracked) contains hardcoded `AdminSeed:Password = \"ChangeMe!123\"` and `Unsubscribe:HmacSecret = \"dev-only-unsubscribe-hmac-secret-change-me\"`. A `UserSecretsId` exists in the csproj but is unused for these values. Move dev secrets to user-secrets/env.\n\n2. **Missing `SlackNotificationService`** — Required by spec (`CLAUDE.md` line 28, spec line 61–62, plan C2). `Slack.Webhooks` 1.1.6 is referenced in the csproj but **no implementation exists** anywhere in `Services/`. `Services/README.md` documents it as if present — inaccurate.\n\n3. **Missing `INotificationService`** — Required by spec (`CLAUDE.md` line 26, spec line 61). **No interface and no `EmailNotificationService` exist.** The current `IMailSender`/`IdentityEmailSender` cover only Identity account emails, not the article-notification abstraction. This is the core notifications architecture and is entirely unbuilt (consistent with plan items S5/C2/C3 being unchecked, but a gap against the spec).\n\n4. **Missing unsubscribe (RFC 8058) implementation** — `UnsubscribeOptions`/`HmacSecret` are wired and validated, but no HMAC signing/verification code, endpoint, or page exists. Feature stubbed at config level only.\n\n5. **No `IValidateOptions` wiring** — Validation is done exclusively via `ValidateDataAnnotations().ValidateOnStart()`. There is **no custom `IValidateOptions&lt;T&gt;`** for cross-field/semantic rules (e.g. requiring `UserName`+`Password` together when `UseStartTls`, or validating the SMTP host reachability). Acceptable for now, but flagged as requested — anything beyond attribute validation is absent.\n\n6. **MailKit error handling absent** — `MailKitMailSender.SendAsync` has no try/catch and no error logging; SMTP failures propagate raw into the Identity UI, and there is no per-recipient resilience for future batch notifications.\n\n7. **Missing `ConfigureAwait(false)`** — All four awaits in `MailKitMailSender.SendAsync` (Connect/Authenticate/Send/Disconnect) lack `ConfigureAwait(false)`. Also the startup awaits in `Program.cs` (expected there). Low practical impact under ASP.NET Core, but flagged.\n\n8. **MailKit client disposal** — Uses synchronous `using var client` on an async `SmtpClient`; `await using`/`DisposeAsync` would be more correct. Disconnect-before-dispose mitigates it. (Client is correctly created per-send, not shared — that part is right.)\n\n9. **Blocking async** — None found. Startup uses awaited async (`MigrateAsync`/`SeedAsync`); no `.Result`/`.Wait()`/`.GetAwaiter().GetResult()` anywhere.\n\n10. **Hardcoded values** — `EmailLayout.BrandColor = \"#0d6efd\"` and the \"LuminaFeed\" footer string are hardcoded in `EmailLayout.cs` (cosmetic). `AdminUserSeederTests`/`MailKitMailSenderTests` hardcode `ChangeMe!123` matching the committed dev password (couples tests to the committed secret). `EmailLayout` interpolates URLs/headings without HTML encoding (injection risk if user data ever flows in).\n\n11. **Custom admin claim not revocable until re-login** — `AdminClaimsPrincipalFactory` bakes `IsAdmin` into the cookie; demoting a user has no immediate effect (no revalidation of that claim).\n\n12. **Test gaps** — No transport-level MailKit test, no real `Program.cs`/DI integration test (options pipeline re-declared inline, `ValidateOnStart` not asserted), no Slack/`INotificationService`/unsubscribe tests (code absent), `SmokeTests` is a placeholder. `Services/README.md` describes services that don't exist.\n\nKey file paths: `D:\\Work\\Sonrisa\\LuminaFeed\\LuminaFeed\\Services\\Email\\{IMailSender,MailKitMailSender,EmailMessage,EmailLayout,IdentityEmailSender}.cs`, `...\\Authorization\\{AdminAuthorization,AdminClaimsPrincipalFactory}.cs`, `...\\Program.cs`, `...\\appsettings.json`, `...\\appsettings.Development.json`, `...\\Options\\*.cs`, `...\\Data\\Seed\\{DatabaseSeeder,AdminUserSeeder}.cs`, `...\\Services\\README.md` (stale), and all seven test files under `D:\\Work\\Sonrisa\\LuminaFeed\\LuminaFeed.Tests\\`.<\/result>\n<usage><subagent_tokens>61629<\/subagent_tokens><tool_uses>33<\/tool_uses><duration_ms>152904<\/duration_ms><\/usage>\n<\/task-notification>"}, {"kind": "response", "ts": "2026-09-21T20:25:11.613Z", "text": "Two agents in. Waiting for the domain/data-layer explorer to finish.", "thinking": "", "tools": []}, {"kind": "prompt", "cls": "typed", "ts": "2026-09-21T20:25:13.825Z", "text": "<task-notification>\n<task-id>a11067f19a49ec815<\/task-id>\n<tool-use-id>toolu_01FjF72AdPnbuDfFtsbWJ77G<\/tool-use-id>\n<output-file>C:\\Users\\thevi\\AppData\\Local\\Temp\\claude\\D--Work-Sonrisa-LuminaFeed\\30657923-1fd5-4c32-87bf- ` (35), `ICollection&lt;Article&gt; Articles = []` (36).\n\n### `Subscription.cs` (sealed, `: EntityBase`)\n- `required string UserId` (12) + `ApplicationUser User = null!` (13) — **string FK to Identity user, not a GUID**.\n- `Guid FeedId` (15) + `Feed Feed = null!` (16).\n- `bool EmailEnabled` (18); `bool SlackEnabled` (20); `string? SlackWebhookUrl` (23).\n- `DateTimeOffset CreatedAt = DateTimeOffset.UtcNow` (25).\n\n**Domain findings:**\n- **Mutable public setters everywhere**, including `EntityBase.Id`, `FetchedAt`, `CreatedAt`, and all navigation collections (settable, not `{ get; }`). No encapsulation / factory methods / invariants. For a senior review this is the \"mutable public setters where they shouldn't be\" flag — Id and the audit timestamps in particular should be private-set or init-only.\n- **Unenforced domain invariant:** `Subscription.SlackEnabled == true` does not require `SlackWebhookUrl` (the XML doc on line 22 says it is \"required when SlackEnabled is set\", but nothing enforces it — not in the entity, not in EF). Same for `EmailEnabled`. No `[Required]`, no check constraint, no ErrorOr/FluentValidation guard at this layer.\n- **GUID v7 convention exception:** `ApplicationUser` (Identity) still uses a string Id (Identity's own `NewGuid().ToString()`), and `Subscription.UserId` is therefore a plain string FK. That is expected for ASP.NET Identity, but it means \"all entities use GUID v7\" is only true for the four custom domain entities, not literally all persisted entities.\n\n## 2. EF Core persistence (`LuminaFeed/Data/`)\n\n### `ApplicationDbContext.cs`\n- `IdentityDbContext&lt;ApplicationUser&gt;`; four `DbSet`s (10-13). `ApplyConfigurationsFromAssembly` (18) — configs auto-discovered. Clean.\n\n### `ApplicationUser.cs`\n- `IdentityUser` + `bool IsAdmin` (10) + `ICollection&lt;Subscription&gt; Subscriptions = []` (12). Role model is a flag, per CLAUDE.md.\n\n### Configurations\nAll four set `HasKey(Id)` + **`Property(Id).ValueGeneratedNever()`** — correct so the client v7 GUID is stored verbatim (not overwritten by a DB/EF generator). This is the right pairing with `CreateVersion7()`.\n\n- **CategoryConfiguration:** `Name` required, max 100, **unique index** (15); `Description` max 1000; `Feeds` → `Category` FK `CategoryId`, **`DeleteBehavior.Restrict`** (22) — deleting a category with feeds is blocked. Correct.\n- **FeedConfiguration:** `Name` max 200; `FeedUrl`/`SiteUrl`/`ImageUrl` max 2048; `Description` max 1000; `ETag` max 512; `LastModified` max 256. **`FeedUrl` unique index** (22). `Articles` **Cascade** (27); `Subscriptions` **Cascade** (32).\n- **SubscriptionConfiguration:** `UserId` required (14, **no max length**); `SlackWebhookUrl` max 2048; **unique index `(UserId, FeedId)`** (18); `User` FK **Cascade** (23). Feed FK cascade comes from FeedConfiguration.\n- **ArticleConfiguration:** `ExternalId` max 1024, `Title` max 500, `Link` max 2048, `ImageUrl` max 2048; **unique index `(FeedId, ExternalId)`** (20). `Summary` has **no max length** (unbounded TEXT).\n\n**Persistence findings:**\n- **Missing index for the default public sort.** CLAUDE.md/spec: public list orders feeds by popularity (default) within a category. There is only `IX_Feeds_CategoryId` and the unique `IX_Feeds_FeedUrl`; **no index on `Popularity` (nor composite `(CategoryId, Popularity)`)**. The headline query will sort without index support.\n- **`Subscription.UserId` has no `HasMaxLength`.** It participates in the unique index `(UserId, FeedId)`. On SQLite this is fine, but it is an unbounded string in an index and mismatches Identity's `nvarchar(450)` key width — a portability/correctness smell if this ever moves off SQLite (SQL Server rejects an index on unbounded nvarchar).\n- **Double cascade path into `Subscription`.** Both `AspNetUsers → Subscriptions` (Cascade) and `Feeds → Subscriptions` (Cascade) are cascade. SQLite tolerates multiple cascade paths; SQL Server would throw on migration (\"may cause cycles or multiple cascade paths\"). Flag for portability.\n- Delete behaviors are otherwise sensible: category delete Restrict, feed delete cascades its articles + subscriptions.\n- `Article.Summary` unbounded is presumably intentional (article body text) but is the one string column with no cap.\n- No optimistic concurrency token (`RowVersion`/`xmin`) on `Feed`, whose polling cache (`ETag`, `LastModified`, `LastPolledAt`) is written by a background service — concurrent writes are last-writer-wins. Minor for single-instance.\n\n## 3. Seeding (`LuminaFeed/Data/Seed/`)\n\n### `DatabaseSeeder.cs`\n- **Idempotent, insert-missing-only.** Categories keyed by `Name` (loads existing into a HashSet, 31-33, skips matches); feeds keyed by `FeedUrl` (57-59). Existing rows are never modified — safe against later admin CRUD edits.\n- GUIDs are **not** set in the seeder — new `Category`/`Feed` get their v7 Id from `EntityBase`'s initializer. Consistent with the convention (no hardcoded seed GUIDs).\n- Feeds with an unknown category name are logged and skipped (73-76). Saves only when `added &gt; 0`.\n\n### `SeedCatalog.cs` / `SeedCatalogLoader.cs`\n- Catalog shape is `records` with `init`-only props (immutable — good). `SeedCatalog` deserialized from **embedded** `rss-feeds.json` (the `doc/research/` file linked into the assembly).\n- `SeedCatalogLoader.LoadEmbedded()` resolves the manifest resource by **suffix match** (51-52) with `SingleOrDefault` — robust, but `SingleOrDefault` throws if two resources ever end with `rss-feeds.json`. Parse validates non-empty and non-zero categories/feeds (26-27). `JsonSerializerDefaults.Web` (case-insensitive) matches the PascalCase JSON I confirmed in `doc/research/rss-feeds.json`.\n\n### `AdminUserSeeder.cs`\n- **Idempotent:** no-op when unconfigured (21-24); if user exists, promotes to admin only if not already (32-38); otherwise creates with `EmailConfirmed = true` and `IsAdmin = true`.\n- **Password is NOT stored plaintext** — created via `userManager.CreateAsync(user, opts.Password!)` (49), so Identity hashes it. Failure is logged, not thrown (56-58) — a failed admin seed does not stop startup (arguably it should surface louder).\n\n**Seeding findings:**\n- **Plaintext admin credentials in `appsettings.Development.json`** (lines 15-18): `admin@luminafeed.local` / `ChangeMe!123`. Dev-only and documented as such, but it is a committed default credential — flag it, and ensure it never leaks into a non-dev config. Same file has a dev `HmacSecret` placeholder (line 13).\n- **Seeding is not transactional and races across instances.** `Program.cs` runs migrate + seed at startup (77-83) with the caveat comment (75-76). Two instances starting together could both attempt inserts; the unique indexes on `Category.Name`/`Feed.FeedUrl` would then throw a `DbUpdateException` on the loser. Single-instance is fine.\n- **Odd cancellation token:** `Program.cs:81` passes `app.Lifetime.ApplicationStopping` as the seeder's `CancellationToken`. That token signals *shutdown*, not startup timeout — semantically wrong; seeding would only cancel if the app is already stopping.\n\n## 4. Options (`LuminaFeed/Options/`)\n\n- **PollingOptions:** `IntervalSeconds` `[Range(1, int.MaxValue)]` default 60; `Interval` TimeSpan accessor. Wired with `ValidateDataAnnotations().ValidateOnStart()` (Program 60-63). Good.\n- **SmtpOptions:** `[Required] Host`, `[Range(1,65535)] Port` (default 25), `[Required, EmailAddress] FromAddress`, `FromName`, `UseStartTls`, optional `UserName`/`Password`. Validated + ValidateOnStart (56-59).\n- **UnsubscribeOptions:** `[Required, MinLength(16)] HmacSecret`. Validated + ValidateOnStart (64-67).\n- **AdminSeedOptions:** `Email`, `Password` (both nullable), `IsConfigured` computed. **No validation attributes and deliberately not `ValidateOnStart`** (Program 68-70) since empty means \"no admin.\"\n\n**Options findings:**\n- **Base `appsettings.json` fails `ValidateOnStart` by itself.** `Smtp.Host = \"\"` violates `[Required]` (empty string is invalid for `RequiredAttribute` by default) and `Unsubscribe.HmacSecret = \"\"` violates `[Required, MinLength(16)]`. In Development these are overridden (Host `localhost`, real dev secret), so dev boots; but **a Production start with only `appsettings.json` will throw at startup** until real values are supplied. This is arguably intended (fail-fast), but worth calling out as it means the shipped base config is non-bootable.\n- **No cross-field validation via `IValidateOptions`.** `AdminSeedOptions` can be half-configured (Email without Password) — `IsConfigured` guards the seeder, but there's no error surfaced. `SmtpOptions` has no rule that when `UserName` is set `Password` must be too, or that `UseStartTls`/auth are consistent. `SmtpOptions.Password` is a plaintext string option (expected, but should come from secrets, not config files).\n\n## 5. Migration (`20260921194225_AddDomainModel.cs`)\n\nHigh level, adds:\n- **`AspNetUsers.IsAdmin`** — `INTEGER NOT NULL DEFAULT 0` (14-19).\n- **`Categories`** (Id TEXT PK, Name TEXT(100), Description TEXT(1000)).\n- **`Feeds`** (Id PK, Name(200), CategoryId FK→Categories **Restrict**, FeedUrl(2048), SiteUrl(2048), ImageUrl(2048), Description(1000), Popularity INTEGER, ETag(512), LastModified(256), LastPolledAt).\n- **`Articles`** (Id PK, FeedId FK→Feeds **Cascade**, ExternalId(1024), Title(500), Link(2048), Summary TEXT unbounded, ImageUrl(2048), PublishedAt, FetchedAt).\n- **`Subscriptions`** (Id PK, UserId FK→AspNetUsers **Cascade**, FeedId FK→Feeds **Cascade**, EmailEnabled, SlackEnabled, SlackWebhookUrl(2048), CreatedAt).\n- Indexes: `IX_Articles_FeedId_ExternalId` (unique), `IX_Categories_Name` (unique), `IX_Feeds_CategoryId`, `IX_Feeds_FeedUrl` (unique), `IX_Subscriptions_FeedId`, `IX_Subscriptions_UserId_FeedId` (unique).\n- GUID PKs stored as `TEXT`, `DateTimeOffset` as `TEXT` (SQLite). Migration exactly matches the fluent configuration — no drift. `Down` drops all four tables and the column.\n\n---\n\n## Priority summary for the review\n\nHigh:\n- Mutable public `Id` setter + all-public-setter anemic entities (`Domain/EntityBase.cs:9` and all four entities) — no encapsulation/invariants.\n- `SlackEnabled`/`EmailEnabled` vs `SlackWebhookUrl` invariant is unenforced anywhere (`Domain/Subscription.cs:18-23`).\n- Missing index supporting the default popularity sort — no index on `Feed.Popularity` / `(CategoryId, Popularity)` (`Configurations/FeedConfiguration.cs`).\n- Committed default admin credentials in `appsettings.Development.json:15-18`.\n\nMedium:\n- Base `appsettings.json` cannot pass `ValidateOnStart` (empty `Smtp.Host`, empty `Unsubscribe.HmacSecret`) — Production needs overrides (`appsettings.json:12-26`, `Program.cs:56-67`).\n- Double cascade path into `Subscriptions` and unbounded `Subscription.UserId` in a unique index — SQLite-only-safe, breaks on SQL Server (`Configurations/SubscriptionConfiguration.cs:14,18-23`, `FeedConfiguration.cs:29-32`).\n- Startup seeding not transactional / racy across instances; unique constraints would throw on concurrent seed (`Program.cs:77-83`).\n- Wrong cancellation token (`ApplicationStopping`) passed to the seeder (`Program.cs:81`).\n- No `IValidateOptions` cross-field validation; `AdminSeedOptions` can be half-configured (`Options/AdminSeedOptions.cs`).\n\nLow:\n- `ApplicationUser` is not GUID v7 (Identity string key) — expected but a literal exception to the \"all entities\" convention.\n- `Article.Summary` unbounded; `Feed` polling-cache fields have no concurrency token.\n\nGood (no action):\n- GUID v7 genuinely used and correctly paired with `ValueGeneratedNever()`.\n- Both seeders are idempotent; admin password is Identity-hashed, not plaintext in the DB.\n- Unique constraints present where they matter: `Category.Name`, `Feed.FeedUrl`, `(UserId, FeedId)`, `(FeedId, ExternalId)`.\n- Migration matches configuration exactly.<\/result>\n<usage><subagent_tokens>50282<\/subagent_tokens><tool_uses>32<\/tool_use ead-only) at what exists outside the worktree as a side effect of this session.\n\nPhase 1 (S1–S5) is implemented and committed on `phase-1` as six commits (plan, then one per step). The build has 0 warnings and all 200 tests pass, up from 37. The definition of done is covered end to end by a test through the real host, and I also ran it once against live feeds. Two things are unverified: nobody has clicked the Subscribe or admin buttons in a browser, and no real email has been delivered, because Papercut wasn't running.\n\n| Commit | Step |\n|---|---|\n| `aed9a38` | `doc/plans/P1-walking-skeleton.md`, with your rule verbatim, the three decisions you made, and an Outcome section |\n| `978545d` | **S1** — `/admin/categories` and `/admin/feeds`, add and list only. I switched database access to `IDbContextFactory`, because Blazor Server circuits and the polling service outlive a request. |\n| `2a252d5` | **S2** — `/` shows every feed as a card grouped by category. The template's Counter, Weather and Auth sample pages are removed. |\n| `b1063a7` | **S3** — email-only Subscribe, and a red Unsubscribe when already subscribed. Anonymous visitors go to login with a `ReturnUrl`. |\n| `299ae84` | **S4** — background polling with the hand-rolled RSS/Atom/RDF parser. Only subscribed feeds are polled, and articles are de-duplicated on `(FeedId, ExternalId)`. A feed's first poll notifies the newest 5 (configurable). |\n| `f809798` | **S5** — `INotificationService` and `EmailNotificationService`, sending one table-based digest per subscriber per polling pass. |\n\nEach step includes its tests, a `doc/features/` doc and its master-plan tick.\n\n**How it was checked**\n- `WalkingSkeletonTests` runs the whole flow through the real host, with only the HTTP fetch and the SMTP send faked. It covers: admin adds a feed, the feed shows on `/`, a user subscribes, polling stores 8 items, and the newest 5 are emailed. It also checks that no new items sends no email, one new item sends exactly nd I've reviewed the spec, master plan, and existing code. Before starting, I'm laying out my working assumptions on commit structure, file boundaries, render modes, and per-feature scope so you can flag anything wrong before I proceed.\n\n\n\nAll 172 tests pass and the source is free of stray control characters. Before documenting S4, I'll do a quick uncommitted live check of the parser against the real seeded catalogue using read-only GETs, saving results under `bin/`.\n\n\n\nI'll harden the fetcher to handle the four feeds that redirect https→http (re-upgrading to https) and support \"BST\"-style zone names, then add tests for both and re-run the live check.\n\n\n\n114/115 feeds are fetching and parsing successfully (3,539 items, 99% dated); the New Scientist failure appears to be bot-fingerprinting against .NET's HTTP stack (curl works fine), which I'll document for C4, while Space.com and NYT Sports are just empty at the source. Removing the temporary check now and documenting S4.\n\n\n\nClean boot succeeded: migrations ran, 10 categories/115 feeds seeded, admin user created, and polling started with no issues beyond the usual HTTPS-redirect notice. Now I'll subscribe the dev admin to a real feed in the worktree's dev DB and watch the next polling tick to exercise the live pipeline.\n\n\n\nLive test confirms the pipeline works across BBC (RSS), Deutsche Welle (RDF), and The Register (Atom), correctly capping notifications to 15 and gracefully handling the SMTP refusal without breaking the loop. Now I'll verify the next tick properly de-dups before stopping the app.\n\n\n\nI noticed a failed send got logged three times across the transport, notification service, and dispatcher. I'll fix this by having the notification service just return the error instead of logging it, so only the dispatcher reports it once.", "tools": [{"name": "Glob", "detail": "doc/**/*"}, {"name": "Bash", "detail": "List working directory, recent commits, and worktrees"}, {"name": "Read", " E / DISAGREE / DOWNGRADE / UPGRADE (severity in brackets = my severity).\n\n### A. Correctness\n\n| # | Verdict | Reason |\n|---|---|---|\n| A1 | AGREE, DOWNGRADE to M | Real, but the burst is bounded by the *document* size (a feed carries its last N items, not \"everything published in the gap\"), i.e. the same magnitude the first-poll cap already handles. Fix is right (see 3d); note it also caps after host downtime &gt; window, which is fine but must be documented. |\n| A2 | DOWNGRADE to L, defer to C4 | Correct observation (worst case is actually 4 x 30 s per feed, because the manual redirect loop at `HttpFeedFetcher.cs:65-74` re-enters `GetAsync` and restarts the 30 s `HttpClient.Timeout` at `:25`), and at normal latency 115 feeds x ~0.5-1 s already exceeds the 60 s interval. But SQLite serialises writers anyway, C4 (304s) shrinks most fetches to nothing, and C4 rewrites this method. Doing `Parallel.ForEachAsync` now means doing the merge twice. Put it in the C4 plan; drop `MaxConcurrentFeeds` from P1.R. |\n| A3 | AGREE (trivial) | `PeriodicTimer` throws above `uint.MaxValue-1` ms; `[Range(1, 86_400)]` is right. Two-line change plus one theory row. |\n| A4 | AGREE | Falls out of B2 for free. |\n| A5 | AGREE (L) | `FeedParser.cs:101` — honour `isPermaLink=\"false\"`. |\n| A6 | AGREE (L) | Per-feed line to Debug. |\n| A7 | AGREE (L) | Note the seeder is insert-missing-only (`DatabaseSeeder.cs:65-69`), so an *existing* dev `app.db` keeps the `http://` URLs until regenerated; say so. Don't build a `UrlRules` helper for one predicate — make `CreateFeedRequestValidator.BeAbsoluteHttpUrl` `internal static` and use it. |\n\n### B. Design\n\n| # | Verdict | Reason |\n|---|---|---|\n| B1 | AGREE, but simpler shape | Prefer `public const int NameMaxLength = 100;` **on the entity classes** (`Category.NameMaxLength`, `Feed.UrlMaxLength`, ...) over a parallel `Limits.Category.*` hierarchy: no new file, no second taxonomy to keep aligned, and the EF config reads `HasMaxLength(Category.NameMaxLength)` naturally. Keep one plain drift test per entity; don't reflect over the model. |\n| B2 | AGREE, UPGRADE to \"do first\" | This is the change that shapes C2/C4/C5. Add `ArticleId` to `NewArticle` (C4's og:image backfill and any digest-retry need the persisted id). Do **not** put channel info on `NewArticle`; see 3b/3c. |\n| B3 | DOWNGRADE to optional / first commit of C4 | Right seam (see 3c) but zero functional value now, and the plan's `IFeedPoller` interface + fake + moved tests is churn on a 160-line class. If done now: extract an `internal sealed class FeedPoller` **without** an interface and keep `FeedPollingServiceTests` untouched. |\n| B4 | AGREE (L) | Mechanical; do it inside the B2 commit since `IFeedPollingService` changes anyway. |\n| B5 | AGREE | Comment only. |\n| B6 | AGREE, add one line | The doc note should record the actual invariant: **every persisted `DateTimeOffset` is UTC** (`FeedParser.ParseDate` normalises with `ToUniversalTime()`, `timeProvider.GetUtcNow()`, `DateTimeOffset.UtcNow`). SQLite stores `DateTimeOffset` as TEXT and EF compares/orders it as text, which is only correct if offsets are uniform — B4's feed page will `OrderByDescending(a =&gt; a.PublishedAt)` in SQL and depends on this. |\n| B7 | AGREE | Leave. |\n\n### C. UI / spec\n\n| # | Verdict | Reason |\n|---|---|---|\n| C1 | AGREE (H on the plan's scale), but the fix must grow | See 2.1: today the confirm link doesn't work at all, so the \"Continue\" link is moot until that is fixed. Also (i) guard `ReturnUrl` with `StartsWith('/') &amp;&amp; !StartsWith(\"//\") &amp;&amp; !StartsWith(\"/\\\\\")` rather than relying on `Uri.IsWellFormedUriString(…, UriKind.Relative)` — add `returnUrl=//evil.example` as a test row (the template's `IdentityRedirectManager.cs:24` guard should reject it, but a 1-line explicit check is cheaper than being wrong); (ii) `ConfirmEmail.razor:41` `Base64UrlDecode(Code)` throws `FormatException` on a hostile `code` → 500; catch it and show the error message. |\n| C2, C3 | AGREE (L) | |\n| C4 | AGREE | Leave for B1. |\n| C5 | AGREE (L) | Cheap a11y win. |\n| C6 | AGREE | Correct to record as a Phase 2 prerequisite; the background service has no `NavigationManager`, so C5's link *cannot* be built without `SiteOptions.PublicBaseUrl`. |\n\n### D. Tests\n\n| # | Verdict | Reason |\n|---|---|---|\n| D1 | AGREE, DOWNGRADE to M, and there is a 1-line version | The startup pass runs at `CreateClient()` before any subscription exists (one empty query vs. ≥100 ms of test work), so the realistic flake is the **60 s tick** landing in a slow CI run, not the first pass. Lean fix: set `[\"Polling:IntervalSeconds\"] = \"86400\"` in `TestAppFactory` (valid under A3's range). The loop stays hosted (HostBootTests unchanged), no DI surgery, no `ActivatorUtilities`. The plan's descriptor-removal approach is also correct if you prefer it (confirmed safe, see 4a). |\n| D2 | DOWNGRADE to \"only with A2\" | With D1 done nothing touches `FakeFeedFetcher` concurrently; it is only needed for `Parallel.ForEachAsync` tests. Moves to C4 with A2. |\n| D3 | AGREE (L/M, nice-to-have) | The current test costs ~1-2 s wall clock with a 15 s timeout — not actually flaky. Worth doing only because the same `ManualTimeProvider` also serves A1's tests (replace `FixedTimeProvider`, which is a private nested class at `FeedPollingServiceTests.cs:14`, not in `PollingTestDoubles` as the plan says). Sketch in 4b. |\n| D4 | AGREE (M, cheap) | |\n| D5 | AGREE mostly; DROP the counting-`IFeedService`-decorator idea | Over-engineering for one assertion; keep the `Blazor-Server-Component-State` marker (only `Home` persists state, so it does prove the claim) or drop the comment. The rest (`!IsCompleted`, `&lt;option value=\"{id}\"&gt;`, `btn-danger` scoping, `TestSignIn` cookie assert) are fine. |\n| D6 | AGREE (L) | Skip if time-boxed. |\n| D7 | AGREE (L) | One-line change to `ListLogger`. |\n| D8 | DISAGREE (non-issue) | `ClearAllPools()` only disposes *idle pooled* connections; the parallel unit-test collections use kept-open `:memory:` connections that EF never closes (`SqliteTestDatabase.cs:19-26`), so they are unaffected. `ClearPool` is fine but buys nothing; adding `UnauthorizedAccessException` to the catch is harmless. |\n| D9 | AGREE | Accepted gap. |\n\n### E. Docs\n\nAll AGREE. E5 is the important one (Phase 2 bullets describe work S4/S5 already did). Add to the re-baseline the four prerequisites listed in 2.3 below. One correction to the plan's own Verification step 4: \"confirm via the link logged by the SMTP failure\" — nothing logs the link; `MailKitMailSender.cs:41` logs only recipient + subject on failure. Papercut must be running for that walkthrough (and after 2.1 it is the most important step of the whole plan).\n\n---\n\n## 2. What the plan missed\n\n### 2.1 H — Identity confirmation / reset links are double-encoded (flow-breaking)\n\nChain:\n\n- `Components/Account/Pages/Register.razor:95`: `EmailSender.SendConfirmationLinkAsync(user, Input.Email, HtmlEncoder.Default.Encode(callbackUrl))` — the stock template pre-encodes because the stock no-op sender interpolates raw into `&lt;a href='{link}'&gt;`.\n- `Services/Email/IdentityEmailSender.cs:18` encodes it **again** for the fallback anchor, and `:22` passes it to `EmailLayout.Button`, which encodes at `EmailLayout.cs:67`. `IdentityEmailSender.cs:27` puts the *single-encoded* string into the plain-text part.\n\n`callbackUrl` always has ≥2 query parameters (`userId`, `code`), so it always contains `&amp;`. HTML part: `href=\"...userId=X&amp;amp;amp;code=Y\"` → browser navigates to `?userId=X&amp;amp;code=Y` → query keys are `userId` and `amp;code`. Text part: `...&amp;amp;code=Y` → same. `ConfirmEmail.razor:27-29` sees `Code == null` → `RedirectTo(\"\")` → home, unconfirmed. With `RequireConfirmedAccount = true` (`Program.cs:62`) the user can never sign in.\n\nSame defect at `ResendEmailConfirmation.razor:61`, `ForgotPassword.razor:62`, `ExternalLogin.razor:164`, `Manage/Email.razor:105` and `:130`. G0.9 introduced the second encoding (\"email encoding consistency\"); its plan lists a manual Papercut check (`G0.9-…md:42`) but the P1 outcome records Papercut was never running, and `IdentityEmailSenderTests` feed *raw* links, so nothing ever exercised the real pair.\n\n**Fix:** remove `HtmlEncoder.Default.Encode(...)` at the six call sites (the sender owns encoding — which is exactly what its tests assert). **Test:** through the real host, POST the Register form (mirror `TestSignIn`), pull the link out of `RecordingMailSender.Sent[0].TextBody`, `GET` it, assert `EmailConfirmed == true` — and, once C1 lands, that the page offers `Account/Login?ReturnUrl=%2F`. This test is the natural home for C1, so merge them into one step.\n\n### 2.2 Other new findings\n\n| Sev | Where | Finding | Fix |\n|---|---|---|---|\n| M | `Services/Polling/FeedParser.cs:184-198`, regexes `:247-254`; called for the **unbounded** title at `:105` and the raw description at `:117` | Regex pipeline runs on untrusted input up to the 10 MB fetch cap with no length bound and no match timeout. `ScriptOrStyle()` (lazy `.*?` + backreference) and `Tag()` (`&lt;[^&gt;]+&gt;`) are both O(n²) on adversarial input (`&lt;script&gt;` repeated with no closer; `&lt;&lt;&lt;&lt;…` with no `&gt;`). One hostile or compromised publisher stalls the whole sequential polling pass for minutes-hours; the 30 s timeout only covers the fetch. | Cap the HTML handed to `PlainText` (e.g. 64 KB — the text is truncated to 1000 chars anyway) and add `matchTimeoutMilliseconds` to the generated regexes as a backstop. Three lines; one parser test. |\n| M (record for C4) | `HttpFeedFetcher.cs:60-80`, master-plan C4 | Today the fetcher only follows admin-entered feed URLs (documented as trusted). C4's `og:image` scraping will make the server fetch **publisher-controlled** article `Link`s, following up to 50 automatic redirects — a textbook SSRF surface (cloud metadata, internal hosts). | Record as a C4 prerequisite next to C6: resolve + reject private/loopback/link-local addresses before connecting, and re-check on each redirect hop. |\n| L | `appsettings.json:3` (`Cache=Shared`) | Template default. SQLite shared-cache mode is legacy and turns cross-connection contention into `SQLITE_LOCKED` (Microsoft.Data.Sqlite retries, but it degrades); with a background writer plus interactive readers, WAL journal mode is the right setting. | Not P1.R; note for the C4/deployment plan (drop `Cache=Shared`, `PRAGMA journal_mode=WAL` once at startup). |\n| L (spec) | `Components/Shared/FeedCard.razor:16` vs spec line 37 | Spec: \"Each card has two buttons; one leads the user to that particular RSS feed's page\". The card has \"Visit site\" (external) + Subscribe; the feed page is B4. | Master-plan note under B4: \"Visit site\" becomes/joins the feed-page button. |\n| L | `EmailNotificationService.cs:57-61` | Subject interpolates a title of up to 500 chars. MailKit folds it, but it is ugly. | C3 concern; not now. |\n| Checked, fine | `FeedPollingService.cs:101-104` | `candidateIds.Contains(...)` on a large local list: EF Core 8+ on SQLite translates to `json_each`, one parameter, so the 999-parameter limit does not apply. | None. |\n| Checked, fine | `Home.razor:64-85` | `[PersistentState]` + `??=` correctly prevents the prerender/circuit double query; the user id never comes from the client; `ToggleSubscriptionAsync` is serialised by the circuit dispatcher; `loginUrl` is built from the current path only. | None. |\n| Checked, fine | `Program.cs:54-58, 75-79` | Lifetimes: transient typed-client `IFeedFetcher` into scoped `FeedPollingService`; singleton notifier over singleton `IMailSender`; singleton loop over `IServiceScopeFactory`. No captive-dependency problems. | None. |\n\n### 2.3 Prerequisites to add to the master-plan re-baseline (E5)\n\n1. `SiteOptions.PublicBaseUrl` (C5 unsubscribe link, C3 templates) — already in the plan as C6.\n2. Outbound URL filter for server-side fetches of publisher URLs (C4 og:image) — 2.2 above.\n3. \"All persisted `DateTimeOffset` are UTC\" invariant (B4 ordering, A1 comparisons) — B6.\n4. SQLite `Cache=Shared` → WAL (C4/deployment).\n\n---\n\n## 3. Design checks\n\n**(a) Single source for column limits.** Yes, but on the entities, not a `Limits` class (B1 above). Keep `FeedParser.SummaryMaxLength` and `EmailNotificationService.SummaryMaxLength` where they are — they are not column limits (`Article.Summary` is unbounded).\n\n**(b) `NewArticle` DTO.** Correct and the most valuable change in the plan. Shape: `NewArticle(Guid ArticleId, Guid FeedId, string FeedName, string Title, string Link, string? Summary, string? ImageUrl, DateTimeOffset? PublishedAt)`. Living in `Services/Notifications/` is fine — Polling already depends on Notifications via `FeedPollingBackgroundService`. It removes the `Feed`-navigation contract, the `UnknownFeedName` fallback and the name-based grouping (A4) in one move.\n\n**(c) Orchestrator / `FeedPoller` split and the result shape.**\nThe seam is right: `FeedPoller` = \"make the DB reflect the publisher\" (fetch → parse → de-dup → insert → stamp `LastPolledAt`; C4 adds `If-None-Match`/`If-Modified-Since` and the 304 short-circuit *here*, and `IFeedFetcher` grows a `FetchResult { NotModified | Content(bytes, etag, lastModified) }`). The orchestrator = \"who cares about what changed\" (active-feed selection, isolation, cap policy, recipient resolution). Channel fan-out belongs in a third place — the existing `DispatchAsync` in `FeedPollingBackgroundService` — fed by a richer digest value. Two refinements:\n\n- Have `FeedPoller` return `PreviousPolledAt` (data) rather than `IsCatchUp` (policy), and let the orchestrator decide; the poller then has no options dependency.\n- Keep `og:image` scraping **out** of `FeedPoller`'s unit of work (a separate, bounded enrichment step after the feed's `SaveChanges`); otherwise per-article 30 s timeouts multiply inside the feed's poll.\n\nOn the key: **keep it keyed by email** (spec letter, nothing to gain now). What C2/C4 need is a richer *value*, not a different key: `SubscriberDigest(string UserId, string Email, IReadOnlyList&lt;FeedDigest&gt; Feeds)` with `FeedDigest(Guid SubscriptionId, Guid FeedId, string FeedName, bool EmailEnabled, bool SlackEnabled, string? SlackWebhookUrl, IReadOnlyList&lt;NewArticle&gt; Articles)`. The email channel takes the feeds with `EmailEnabled`; Slack fans out grouped by webhook URL; C5 gets `SubscriptionId` for the RFC 8058 token. Because `ArticleNotification` is the only consumer, changing the value type in C4 is a contained edit. For P1.R: `IReadOnlyDictionary&lt;string, IReadOnlyList&lt;NewArticle&gt;&gt;` exactly as planned, and say in the doc that the value grows in C4.\n\n**(d) Catch-up window vs. alternatives.**\n- Hard per-pass cap: no — silently drops legitimate articles across feeds and makes results depend on pass timing.\n- Cap whenever `new-count &gt; N`: no — data-dependent (a sports feed legitimately posts 10+ items in a minute during events), untestable as a rule, and indistinguishable from \"later polls are uncapped\".\n- Time window: yes — deterministic and explainable (\"we weren't watching this feed for more than X, treat it like a first poll\"). Keep `CatchUpAfterMinutes` (default 6 h is fine; it must be comfortably larger than the interval). Document that host downtime &gt; window also triggers it. The deeper \"right\" semantic — never notify a subscriber about articles published before their `Subscription.CreatedAt` except the first digest — becomes possible once the value is per-subscription (C4); note it there, don't build it now.\n\n---\n\n## 4. Test-infrastructure feasibility (no new packages)\n\n**(a) Removing only the polling hosted service.** Safe. `AddHostedService&lt;T&gt;` registers `ServiceDescriptor.Singleton&lt;IHostedService, T&gt;()` via `TryAddEnumerable`, so the descriptor has `ImplementationType == typeof(FeedPollingBackgroundService)`; the web host's `GenericWebHostService` descriptor has its own concrete type and survives a filter on that type. `ConfigureTestServices` runs after `Program`'s registrations (proven by the existing `RemoveAll&lt;IFeedFetcher&gt;()` at `TestAppFactory.cs:79`). `ActivatorUtilities.CreateInstance&lt;FeedPollingBackgroundService&gt;(factory.Services)` works because all four constructor dependencies are root-resolvable. That said, the 1-line \"long interval\" variant in D1 gets the same determinism with less surgery.\n\n**(b) Hand-rolled `ManualTimeProvider`.** `PeriodicTimer(period, timeProvider)` calls `timeProvider.CreateTimer(callback, state, period, period)` (inside `ExecutionContext.SuppressFlow`), uses `ITimer.Change` only from the `Period` setter (unused here), and `ITimer.Dispose()` from `using var timer`. Minimal API:\n\n```csharp\ninternal sealed class ManualTimeProvider(DateTimeOffset start) : TimeProvider\n{\n    private readonly object _gate = new();\n    private readonly List&lt;ManualTimer&gt; _timers = [];\n    private DateTimeOffset _now = start;\n\n    public override DateTimeOffset GetUtcNow() { lock (_gate) return _now; }\n    public override long TimestampFrequency =&gt; TimeSpan.TicksPerSecond;\n    public override long GetTimestamp() { lock (_gate) return _now.UtcTicks; }\n    public override ITimer CreateTimer(TimerCallback cb, object? state, TimeSpan due, TimeSpan period)\n    { var t = new ManualTimer(this, cb, state); t.Change(due, period); return t; }\n\n    public void Advance(TimeSpan by)\n    {\n        var target = GetUtcNow() + by;\n        while (true)\n        {\n            ManualTimer? next;\n            lock (_gate)\n            {\n                next = _timers.Where(t =&gt; t.DueAt is { } d &amp;&amp; d &lt;= target).MinBy(t =&gt; t.DueAt);\n                if (next is null) { _now = target; return; }\n                _now = next.DueAt!.Value;\n                next.Reschedule();                 // DueAt += Period, or null for one-shot\n            }\n            next.Fire();                           // outside the lock: callback may Change/Dispose\n        }\n    }\n\n    private sealed class ManualTimer(ManualTimeProvider owner, TimerCallback cb, object? state) : ITimer\n    {\n        public DateTimeOffset? DueAt; public TimeSpan? Period;\n        public bool Change(TimeSpan due, TimeSpan period)\n        {\n            lock (owner._gate)\n            {\n                DueAt = due == Timeout.InfiniteTimeSpan ? null : owner._now + due;\n                Period = period == Timeout.InfiniteTimeSpan || period == TimeSpan.Zero ? null : period;\n                if (!owner._timers.Contains(this)) owner._timers.Add(this);\n            }\n            return true;\n        }\n        public void Reschedule() =&gt; DueAt = Period is { } p ? DueAt + p : null;\n        public void Fire() =&gt; cb(state);\n        public void Dispose() { lock (owner._gate) owner._timers.Remove(this); }\n        public ValueTask DisposeAsync() { Dispose(); return ValueTask.CompletedTask; }\n    }\n}\n```\n\nGotchas:\n1. `PeriodicTimer`'s internal `State` uses `ManualResetValueTaskSourceCore` with `RunContinuationsAsynchronously = true`, so the loop body after `WaitForNextTickAsync` is **queued to the thread pool, not run inside `Advance`**. Tests must still `await polling.WaitForCallsAsync(2, timeout)` after `Advance(interval)`; it is deterministic (no wall-clock trigger) but not synchronous.\n2. The timer is created *after* `await Task.Yield()` in `ExecuteAsync` (`FeedPollingBackgroundService.cs:22-27`), so `Advance` before the first poll has started fires nothing. Sequence: `StartAsync` → `WaitForCallsAsync(1)` → `Advance(interval)` → `WaitForCallsAsync(2)`.\n3. Signals coalesce (`_signaled` is a bool): `Advance(10 × interval)` yields exactly one extra poll, same as production. Don't assert N.\n4. Fire callbacks outside the lock and snapshot the due list; `Dispose` is called from the loop's `using` while `Advance` may be iterating.\n5. The same instance replaces `FixedTimeProvider` for `FeedPollingService` (A1's \"idle feed\" test just calls `Advance(7 h)` between polls).\n\n---\n\n## 5. Priority and a leaner plan\n\n**Must-fix before Phase 2 (in this order):**\n\n| Step | Content | Why now |\n|---|---|---|\n| R1 | 2.1 confirmation-link fix (6 call sites) + C1 Continue link + `//` guard + `FormatException` catch, one real-host register → confirm → `ReturnUrl` test | Registration is broken; C1 builds on it; both are the spec's \"log in or register and return\" flow. |\n| R2 | B2 `NewArticle` (+A4, B4 file moves) + B1 entity constants + A5/A6 | Shapes every Phase 2 track; touching `ArticleLimits` anyway. |\n| R3 | A3 range + A1 window (with `ManualTimeProvider` replacing `FixedTimeProvider`) + parser input cap (2.2) | Cheap correctness; the cap closes a DoS hole in the sequential loop. |\n| R4 | D1 (lean: long interval in `TestAppFactory`) + D4 + D7 + the cheap D5 items | Removes the only real flake mechanism; catalogue growth stops breaking four tests. |\n| R5 | E5 master-plan re-baseline incl. the four prerequisites in 2.3, E1 CLAUDE.md, E2 README, E3/E4/E7 feature docs | Phase 2 plans must not redo S4/S5 work or discover the base-URL/SSRF needs mid-way. |\n\n**Nice-to-have (do if time-boxed, else leave):** A7, C2, C3, C5, D3 beyond what A1 needs, D6, D8 (skip), B5/B6/B7 doc lines.\n\n**Defer to C4 (record, don't build):** A2 + D2 (concurrency and the thread-safe fake), B3 split (first commit of C4, no `IFeedPoller` interface), `Cache=Shared`/WAL.\n\nNet effect: two fewer option knobs (`MaxConcurrentFeeds`, none of the concurrency plumbing), no service split, no `IFeedPoller` fakes, one new test double (`ManualTimeProvider`) instead of two, and one flow-breaking bug fixed that the original plan would have shipped past.\n\n### Critical Files for Implementation\n- D:\\Work\\Sonrisa\\LuminaFeed-phase-1\\LuminaFeed\\Components\\Account\\Pages\\Reg
