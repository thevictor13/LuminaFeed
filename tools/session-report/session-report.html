\n\nLet me read the full spec UI section for exact context, and the current Home page and FeedCard components.\n\nI now understand B1 and B2 well. Let me note the key spec requirements and launch parallel exploration of the codebase.\n\n**B1** — Feed list by category: cards + image, **max 5/category**, single row desktop / wrap mobile, a **more** button that adds 5. *(needs S2, A2)*\n**B2** — Per-category header **order control**: popularity (default) or name, ascending/descending. *(needs B1)*\n\nLet me launch parallel Explore agents to understand the service layer, UI components, and test patterns.\n\nWhile the agents explore, let me review the plan-doc format used in this repo and check the git/worktree situation.\n\nI understand the git layout: five worktrees share one `.git`; I'm on the `phase-2b` worktree. Let me read a representative build-plan doc to match the established plan format.\n\nI've launched three parallel探索 agents and reviewed the plan format. While they run, here's where things stand: I understand B1/B2's requirements from the spec and master plan, the git worktree layout, and the current `Home.razor`/service structure. I'll wait for the exploration results before designing, and I already have one likely blocking question forming (about commit authorization on this branch — the standing constraint text names \"phase-1 branch only\", but the task requires committing on `phase-2b`). I'll confirm that with you once I've finished gathering context.\n\nStanding by for the exploration agents to report back.", "thinking": "", "tools": [{"name": "Read", "detail": "D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\doc\\plans\\00-master-plan.md"}, {"name": "Read", "detail": "D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\README.md"}, {"name": "Read", "detail": "D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\doc\\features\\public-feed-list.md"}, {"name": "Grep", "detail": "D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\doc\\LuminaFeed Initial Specification.md"}, {"name": "Read", "detail": "D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\doc\\LuminaFeed Initial Specification.md"}, {"name": "Read", "detail": "D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed\\Components\\Pages\\Home.razor"}, {"name": "Agent", "detail": "Explore feed service and DTOs"}, {"name": "Agent", "detail": "Explore public UI components"}, {"name": "Agent", "detail": "Explore test patterns for public UI"}, {"name": "Glob", "detail": "doc/plans/*.md"}, {"name": "Bash", "detail": "Inspect worktrees, branches, recent commits"}, {"name": "Read", "detail": "D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\doc\\plans\\G0.3-domain-model.md"}]}, {"kind": "prompt", "cls": "typed", "ts": "2026-09-22T08:40:51.791Z", "text": "<task-notification>\n<task-id>a4e334d143e598f95<\/task-id>\n<tool-use-id>toolu_013ggjgbiXfbmCPAUrHgyEct<\/tool-use-id>\n<output-file>C:\\Users\\thevi\\AppData\\Local\\Temp\\claude\\D--Work-Sonrisa-LuminaFeed-phase-2b\\da174833-2ffa-4cc3-8007-309fa75178c0\\tasks\\a4e334d143e598f95.output<\/output-file>\n<status>completed<\/status>\n<summary>Agent \"Explore feed service and DTOs\" finished<\/summary>\n<note>A task-notification fires each time this agent stops with no live background children of its own. The user can send it another message and resume it, so the same task-id may notify more than once.<\/note>\n<result>I have everything needed. Here is my report.\n\n## LuminaFeed feed data/service layer — findings for B1 &amp; B2\n\nAll paths absolute under `D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\`.\n\n---\n\n### 1. IFeedService interface &amp; FeedService implementation\n\n**Interface:** `LuminaFeed\\Services\\Feeds\\IFeedService.cs` (lines 21-37). Three methods:\n- `ListAsync` — all feeds, ordered category name then feed name (admin list).\n- `ListByCategoryAsync` — the public home-page method (line 30).\n- `CreateAsync` — create with validation.\n\nThe XML doc on `ListByCategoryAsync` (lines 26-30) already states the contract: *\"categories by name, each with its feeds by popularity (highest first, then name). Categories without feeds are omitted.\"*\n\n**Implementation:** `LuminaFeed\\Services\\Feeds\\FeedService.cs`. Full body of `ListByCategoryAsync` (lines 26-42):\n\n```csharp\npublic async Task&lt;IReadOnlyList&lt;CategoryFeeds&gt;&gt; ListByCategoryAsync(CancellationToken cancellationToken = default)\n{\n    await using var db = await dbFactory.CreateDbContextAsync(cancellationToken);\n    var feeds = await db.Feeds\n        .AsNoTracking()\n        .OrderBy(f =&gt; f.Category.Name)\n        .ThenByDescending(f =&gt; f.Popularity)\n        .ThenBy(f =&gt; f.Name)\n        .Select(f =&gt; new FeedSummary(\n            f.Id, f.Name, f.CategoryId, f.Category.Name, f.FeedUrl, f.SiteUrl, f.ImageUrl, f.Description, f.Popularity))\n        .ToListAsync(cancellationToken);\n\n    // GroupBy keeps first-seen key order and element order, so the SQL ordering above carries through.\n    return [.. feeds\n        .GroupBy(f =&gt; (f.CategoryId, f.CategoryName))\n        .Select(g =&gt; new CategoryFeeds(g.Key.CategoryId, g.Key.CategoryName, [.. g]))];\n}\n```\n\nOrdering logic: **one flat SQL query** ordered `Category.Name` → `Popularity DESC` → `Name ASC`, then an **in-memory `GroupBy`** that relies on LINQ-to-Objects preserving first-seen key order and per-group element order. So the ordering is already computed once and materialized; there is no per-category query.\n\nThe service is constructed with `IDbContextFactory&lt;ApplicationDbContext&gt;` (not a scoped context), so spinning up fresh queries is cheap but each call opens a new context. `ListAsync` (lines 14-24) uses `OrderBy(Category.Name).ThenBy(Name)` — no popularity.\n\n---\n\n### 2. DTO types\n\nBoth defined at the top of `LuminaFeed\\Services\\Feeds\\IFeedService.cs` (lines 6-18):\n\n```csharp\npublic sealed record FeedSummary(\n    Guid Id,\n    string Name,\n    Guid CategoryId,\n    string CategoryName,\n    string FeedUrl,\n    string SiteUrl,\n    string? ImageUrl,\n    string? Description,\n    int Popularity);\n\npublic sealed record CategoryFeeds(Guid CategoryId, string CategoryName, IReadOnlyList&lt;FeedSummary&gt; Feeds);\n```\n\n**Yes — `FeedSummary` exposes `Popularity` (int)** and `Name`, so B2 can sort by both popularity and name entirely in memory over the already-loaded `CategoryFeeds.Feeds` list. No new field is needed on the DTO. (Note field names differ slightly from your brief: there is no `Id`/`Description`-only summary — it also carries `FeedUrl`, `SiteUrl`, `CategoryName`.)\n\nThe record is a positional `record` (immutable, value equality) — handy for `@key` and re-sorting produces a new list without mutating shared state.\n\n---\n\n### 3. Feed domain entity\n\n`LuminaFeed\\Domain\\Feed.cs`. `sealed class Feed : EntityBase`. Fields: `Name`, `CategoryId` + `Category` nav, `FeedUrl`, `SiteUrl`, `ImageUrl?`, `Description?`, `Popularity`, plus polling-cache fields `ETag?`, `LastModified?`, `LastPolledAt?`, and collections `Subscriptions`, `Articles`.\n\n- **`Popularity` is `int`** (line 30): *\"Fixed popularity figure (from research) driving the public list's default ordering.\"*\n- **MaxLength constants** (lines 7-11): `NameMaxLength = 200`, `UrlMaxLength = 2048`, `DescriptionMaxLength = 1000`, `ETagMaxLength = 512`, `LastModifiedMaxLength = 256`. Comment (line 6) calls these *\"the single source for the EF configuration, the request validators and the admin forms.\"*\n\n`Id` is a GUID v7 from `EntityBase` (`LuminaFeed\\Domain\\EntityBase.cs`, line 9: `Guid.CreateVersion7()`, client-generated).\n\n---\n\n### 4. EF index definitions — `(CategoryId, Popularity)`\n\nConfigured in `LuminaFeed\\Data\\Configurations\\FeedConfiguration.cs`, lines 24-25:\n\n```csharp\n// Supports the public list's default ordering: feeds by Popularity within a Category.\nbuilder.HasIndex(f =&gt; new { f.CategoryId, f.Popularity });\n```\n\nAlso in that file: unique index on `FeedUrl` (line 22). MaxLengths wired from the `Feed.*MaxLength` constants (lines 14-20).\n\nThe index is materialized in migration `LuminaFeed\\Data\\Migrations\\20260921210325_AddDomainModel.cs` (lines 127-129, `IX_Feeds_CategoryId_Popularity` over `{ \"CategoryId\", \"Popularity\" }`) and in the model snapshot (`ApplicationDbContextModelSnapshot.cs:204`).\n\nNote: the index is `(CategoryId, Popularity)` ascending; the query sorts `Popularity DESC`, so the index isn't a perfect ordering match, but for a curated catalogue (~115 feeds per the Home.razor comment) that's irrelevant.\n\n---\n\n### 5. Existing ordering / paging / \"more\" / take-skip / filter logic\n\n**Ordering — yes, several places** (all `OrderBy`, none reusable as a component):\n- `FeedService.cs:19-20, 31-33` (the two above).\n- `LuminaFeed\\Services\\Polling\\FeedPollingService.cs:26` (`OrderBy(Name)`), and `:104-106` — the **only take/skip in the codebase**: `.OrderByDescending(a =&gt; a.PublishedAt.HasValue).ThenByDescending(a =&gt; a.PublishedAt)` then `.Take(options.Value.FirstPollNotificationCap)`. Unrelated to the home page (article notification cap).\n- `LuminaFeed\\Services\\Categories\\CategoryService.cs:18` (`OrderBy(Name)`).\n- `LuminaFeed\\Services\\Notifications\\EmailNotificationService.cs:53`.\n\n**Paging / \"more\" / max-N-per-category / user-facing order control — none exists.** The grep for `more|Take|Skip|page|Page|LoadMore` across `Components` only hit `@page` route directives and Identity account pages — no load-more, no take/skip, no sort dropdown anywhere in the UI. B1's \"5 per category + more\" and B2's order control are both greenfield.\n\n**Home page rendering:** `LuminaFeed\\Components\\Pages\\Home.razor` (InteractiveServer). Loops `Categories` (line 30) → per category a Bootstrap grid `&lt;div class=\"row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-5 g-3\"&gt;` (line 34), one `FeedCard` per feed. This already gives the wrap-on-mobile / up-to-5-across-on-desktop layout B1 wants — B1's \"single row on desktop, max 5\" is essentially the existing `row-cols-xl-5` capped at 5 items. Key detail (lines 63-67): the catalogue is deliberately **not** persisted across prerender→circuit (32 KB SignalR cap; 115 feeds ≈ 87 KB); it re-queries once on the interactive render. `Categories` is a plain field; `SubscribedIds` is `[PersistentState]`.\n\n`FeedCard` component: `LuminaFeed\\Components\\Shared\\FeedCard.razor` — takes a `FeedSummary Feed` param + `Actions` RenderFragment; renders ImageUrl (if any), Name, Description, \"Visit site\" link. Does **not** use Popularity or CategoryName.\n\n---\n\n### 6. ISubscriptionService signatures (used by Home.razor)\n\n`LuminaFeed\\Services\\Subscriptions\\ISubscriptionService.cs` (lines 16, 22, 25):\n\n```csharp\nTask&lt;IReadOnlySet&lt;Guid&gt;&gt; GetSubscribedFeedIdsAsync(string? userId, CancellationToken cancellationToken = default);\nTask&lt;ErrorOr&lt;Success&gt;&gt; SubscribeByEmailAsync(string? userId, Guid feedId, CancellationToken cancellationToken = default);\nTask&lt;ErrorOr&lt;Deleted&gt;&gt; UnsubscribeAsync(string? userId, Guid feedId, CancellationToken cancellationToken = default);\n```\n\n`userId` must come from the authenticated principal (interface remark + Home.razor:76-81). Home.razor uses all three (lines 89, 112, 103). Uses `ErrorOr` for results; the \"not subscribed\" case is treated as success (`SubscriptionErrors.NotSubscribed.Code`, Home.razor:105). Implementation in `LuminaFeed\\Services\\Subscriptions\\SubscriptionService.cs`.\n\n---\n\n### Recommendation for your B2 decision\n\nDo the B2 ordering **in memory over the already-loaded `CategoryFeeds.Feeds` list** — do not add a new service query. Reasons:\n1. `ListByCategoryAsync` already materializes every feed (all ~115) in one query and hands back fully-populated `FeedSummary` records; `Popularity` and `Name` are both present, so both sort modes and both directions are pure client-side `OrderBy`/`OrderByDescending` on the existing list.\n2. The whole catalogue is already in the component's memory (that's the deliberate design — see Home.razor:63-67); a per-category re-query would add DB round-trips and a new context per interaction for data you already hold.\n3. B1's \"5 + more\" is likewise a client-side `Take(n)` over the in-memory list (grow `n` by 5 per click), state held in the component — no `Skip`/`Take` needs to touch the service.\n4. Sorting is per-category and interactive; keeping it in the component avoids re-running the DB group-by and re-persisting anything across the circuit.\n\nThe only reason to add a service query would be if the catalogue grows large enough that shipping all rows to the circuit becomes the bottleneck — but the current code explicitly accepts one full load as \"the right price,\" so matching that pattern keeps B1/B2 consistent with existing design. If you later want the service to own ordering, `ListByCategoryAsync` would need an order/direction parameter and the in-SQL `ThenBy` clauses swapped accordingly — but that's not necessary for B2 as specified.\n\nOne caveat: `FeedSummary` is an immutable positional record, so re-sorting must produce new lists (fine — `record` equality + `@key=\"feed.Id\"` in Home.razor:37 keeps Blazor diffing correct across re-orders).<\/result>\n<usage><subagent_tokens>42651<\/subagent_tokens><tool_uses>17<\/tool_uses><duration_ms>92393<\/duration_ms><\/usage>\n<\/task-notification>"}, {"kind": "response", "ts": "2026-09-22T08:40:55.614Z", "text": "First agent done — the service layer is clear: `ListByCategoryAsync` loads all feeds in one query, `FeedSummary` exposes `Popularity` and `Name`, and there's no existing paging/ordering UI. B1's \"5 + more\" and B2's ordering can both be done client-side over the already-loaded list. Waiting on the UI-components and test-patterns agents.\n\nI have the FeedCard. Waiting on the remaining two agents (UI components/Bootstrap-JS availability, and test patterns).\n\nConfirmed from `App.razor`: Bootstrap **CSS** is loaded but **not** Bootstrap's JS bundle — so a `data-bs-toggle=\"dropdown\"` menu would not toggle on its own. The order control must be Blazor-driven (a native `<select>`, or a menu whose open/close I handle in the circuit). Waiting on the remaining two agents for the SubscribeButton, scoped CSS, and test patterns.", "thinking": "", "tools": [{"name": "Read", "detail": "D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed\\Components\\Shared\\FeedCard.razor"}, {"name": "Read", "detail": "D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed\\Components\\_Imports.razor"}, {"name": "Read", "detail": "D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed\\Components\\App.razor"}]}, {"kind": "prompt", "cls": "typed", "ts": "2026-09-22T08:42:33.717Z", "text": "<task-notification>\n<task-id>a780c0a628d011cc1<\/task-id>\n<tool-use-id>toolu_01BTDdieTgjGjnBsJxDFzPHR<\/tool-use-id>\n<output-file>C:\\Users\\thevi\\AppData\\Local\\Temp\\claude\\D--Work-Sonrisa-LuminaFeed-phase-2b\\da174833-2ffa-4cc3-8007-309fa75178c0\\tasks\\a780c0a628d011cc1.output<\/output-file>\n<status>completed<\/status>\n<summary>Agent \"Explore public UI components\" finished<\/summary>\n<note>A task-notification fires each time this agent stops with no live background children of its own. The user can send it another message and resume it, so the same task-id may notify more than once.<\/note>\n<result>I have everything needed. Here is my report.\n\n---\n\n# LuminaFeed codebase report — public UI &amp; interactivity (for B1/B2)\n\nAll paths absolute. Project is .NET 10 Blazor Web App, `LuminaFeed\\LuminaFeed.csproj`.\n\n## 1. FeedCard component\n\n`D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed\\Components\\Shared\\FeedCard.razor` (full, 27 lines):\n\n```razor\n@using LuminaFeed.Services.Feeds\n\n@* A feed on the public list: image (when the feed has one), name, description and its actions. *@\n&lt;div class=\"card h-100 feed-card\"&gt;\n    @if (!string.IsNullOrEmpty(Feed.ImageUrl))\n    {\n        &lt;img src=\"@Feed.ImageUrl\" class=\"card-img-top feed-card-image\" alt=\"\" loading=\"lazy\" referrerpolicy=\"no-referrer\"/&gt;\n    }\n    &lt;div class=\"card-body d-flex flex-column\"&gt;\n        &lt;h3 class=\"card-title h6\"&gt;@Feed.Name&lt;/h3&gt;\n        @if (!string.IsNullOrEmpty(Feed.Description))\n        {\n            &lt;p class=\"card-text small text-secondary\"&gt;@Feed.Description&lt;/p&gt;\n        }\n        &lt;div class=\"mt-auto d-flex flex-wrap gap-2\"&gt;\n            &lt;a href=\"@Feed.SiteUrl\" class=\"btn btn-sm btn-outline-secondary\" target=\"_blank\" rel=\"noopener noreferrer\"&gt;Visit site&lt;/a&gt;\n            @Actions\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n\n@code {\n    [Parameter, EditorRequired] public FeedSummary Feed { get; set; } = default!;\n\n    /// &lt;summary&gt;Extra buttons rendered next to the site link (e.g. subscribe).&lt;/summary&gt;\n    [Parameter] public RenderFragment? Actions { get; set; }\n}\n```\n\n- Parameters: `Feed` (required `FeedSummary`) and `Actions` (optional `RenderFragment`).\n- Image: rendered only when `Feed.ImageUrl` is non-empty, as `&lt;img class=\"card-img-top feed-card-image\" ... loading=\"lazy\" referrerpolicy=\"no-referrer\"&gt;` with empty `alt=\"\"` (decorative).\n- `Actions` is a plain unnamed-content-style `RenderFragment` slot placed inside the footer `&lt;div class=\"mt-auto d-flex flex-wrap gap-2\"&gt;`, right after the \"Visit site\" link. Consumers fill it via `&lt;Actions&gt;...&lt;/Actions&gt;` (see Home.razor:39-46).\n- Root is `card h-100` so cards stretch to equal height in a grid row.\n\nScoped CSS `D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed\\Components\\Shared\\FeedCard.razor.css` (full):\n\n```css\n.feed-card-image {\n    height: 7rem;\n    padding: 0.75rem;\n    object-fit: contain;\n    background-color: #f8f9fa;\n}\n```\n\n`FeedSummary` shape — `D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed\\Services\\Feeds\\IFeedService.cs:6-15`:\n\n```csharp\npublic sealed record FeedSummary(\n    Guid Id, string Name, Guid CategoryId, string CategoryName,\n    string FeedUrl, string SiteUrl, string? ImageUrl, string? Description, int Popularity);\n```\n\nNote `Popularity` (int) and `Name` are both on the summary — everything B2's order control needs is already client-side, no extra query.\n\n## 2. SubscribeButton component\n\n`D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed\\Components\\Shared\\SubscribeButton.razor` (full, 29 lines):\n\n```razor\n@* Subscribe / Unsubscribe (red) for signed-in users; anonymous users are sent to log in and come back. *@\n@if (!IsAuthenticated)\n{\n    &lt;a href=\"@LoginUrl\" class=\"btn btn-sm btn-primary\" aria-label=\"@($\"Subscribe to {FeedName}\")\"&gt;Subscribe&lt;/a&gt;\n}\nelse if (IsSubscribed)\n{\n    &lt;button type=\"button\" class=\"btn btn-sm btn-danger\" disabled=\"@Busy\" aria-label=\"@($\"Unsubscribe from {FeedName}\")\" @onclick=\"OnToggle\"&gt;Unsubscribe&lt;/button&gt;\n}\nelse\n{\n    &lt;button type=\"button\" class=\"btn btn-sm btn-primary\" disabled=\"@Busy\" aria-label=\"@($\"Subscribe to {FeedName}\")\" @onclick=\"OnToggle\"&gt;Subscribe&lt;/button&gt;\n}\n\n@code {\n    [Parameter, EditorRequired] public string FeedName { get; set; } = string.Empty;\n    [Parameter] public bool IsAuthenticated { get; set; }\n    [Parameter] public bool IsSubscribed { get; set; }\n    [Parameter] public bool Busy { get; set; }\n    [Parameter, EditorRequired] public string LoginUrl { get; set; } = default!;\n    [Parameter] public EventCallback OnToggle { get; set; }\n}\n```\n\nIdioms to reuse: `btn btn-sm btn-primary`/`btn-danger`, `disabled=\"@Busy\"` for in-flight guarding, `aria-label` naming the feed, and an `EventCallback OnToggle` invoked via `@onclick`. No scoped CSS file for this one.\n\n## 3. ErrorList\n\n`D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed\\Components\\Shared\\ErrorList.razor` (full):\n\n```razor\n@* Renders service error descriptions (from ErrorOr results) as a Bootstrap alert; nothing when empty. *@\n@if (Messages.Count &gt; 0)\n{\n    &lt;div class=\"alert alert-danger\" role=\"alert\"&gt;\n        &lt;ul class=\"mb-0\"&gt;\n            @foreach (var message in Messages)\n            {\n                &lt;li&gt;@message&lt;/li&gt;\n            }\n        &lt;/ul&gt;\n    &lt;/div&gt;\n}\n\n@code {\n    [Parameter, EditorRequired] public IReadOnlyList&lt;string&gt; Messages { get; set; } = [];\n}\n```\n\nAlready used on Home at `Home.razor:18` as `&lt;ErrorList Messages=\"errors\"/&gt;`.\n\n## 4. Layout, _Imports, and — critically — Bootstrap JS\n\n`_Imports.razor` — `D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed\\Components\\_Imports.razor` (full). Global usings available to every component (so Home already has these without re-declaring):\n\n```razor\n@using Microsoft.AspNetCore.Authorization\n@using Microsoft.AspNetCore.Components.Authorization\n@using Microsoft.AspNetCore.Components.Forms\n@using Microsoft.AspNetCore.Components.Routing\n@using Microsoft.AspNetCore.Components.Web\n@using static Microsoft.AspNetCore.Components.Web.RenderMode\n@using Microsoft.AspNetCore.Components.Web.Virtualization\n@using Microsoft.JSInterop\n@using LuminaFeed\n@using LuminaFeed.Authorization\n@using LuminaFeed.Components\n@using LuminaFeed.Components.Layout\n@using LuminaFeed.Components.Shared\n```\n\nNote `LuminaFeed.Components.Shared` is global, so `FeedCard`/`SubscribeButton`/`ErrorList` are usable unqualified. `Virtualization` is imported globally too (available if you want `&lt;Virtualize&gt;` for the feed lists, though not currently used anywhere).\n\nLayout: `D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed\\Components\\Layout\\MainLayout.razor` is a simple sidebar + `&lt;article class=\"content px-4\"&gt;@Body&lt;/article&gt;` shell (`MainLayout.razor.css` handles the sidebar/top-row responsive layout with `::deep` selectors). No CSS/JS is loaded from the layout — all asset loading is in `App.razor`.\n\n### Bootstrap JS: NOT loaded anywhere\n\n- Bootstrap version is 5.3.3 (`D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed\\wwwroot\\lib\\bootstrap\\dist\\css\\bootstrap.min.css` header: \"Bootstrap v5.3.3\").\n- The bundle files exist on disk (`...\\wwwroot\\lib\\bootstrap\\dist\\js\\bootstrap.bundle.min.js` etc.) but **nothing references any Bootstrap JS via a `&lt;script&gt;` tag**. The only script tags in the entire app are in `App.razor` and `ReconnectModal.razor`:\n  - `App.razor:20` → `blazor.web.js`\n  - `App.razor:21` → `Components/Account/Shared/PasskeySubmit.razor.js` (module)\n  - `ReconnectModal.razor:1` → `Components/Layout/ReconnectModal.razor.js` (module)\n- A grep for `data-bs-toggle` / `dropdown` across all `.razor` files returned **no matches** — no component uses Bootstrap's JS-driven behaviors.\n\n**Conclusion for B2:** a Bootstrap `data-bs-toggle=\"dropdown\"` toggle will NOT work — its JS is not on the page. Do not rely on it. Use one of the codebase's existing patterns instead: a native `&lt;select&gt;` bound with `@bind`/`@onchange`, or a Blazor-driven show/hide (`bool` field toggled by `@onclick`, plain CSS). Both work purely through the `InteractiveServer` circuit with no added JS. (Note the CSS-only classes like `dropdown-menu` still style fine; only the toggle interactivity is missing.)\n\n## 5. App.razor / root layout and the CSS-isolation bundle\n\n`D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed\\Components\\App.razor` (full):\n\n```razor\n&lt;!DOCTYPE html&gt;\n&lt;html lang=\"en\"&gt;\n&lt;head&gt;\n    &lt;meta charset=\"utf-8\"/&gt;\n    &lt;meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"/&gt;\n    &lt;base href=\"/\"/&gt;\n    &lt;ResourcePreloader/&gt;\n    &lt;link rel=\"stylesheet\" href=\"@Assets[\"lib/bootstrap/dist/css/bootstrap.min.css\"]\"/&gt;\n    &lt;link rel=\"stylesheet\" href=\"@Assets[\"app.css\"]\"/&gt;\n    &lt;link rel=\"stylesheet\" href=\"@Assets[\"LuminaFeed.styles.css\"]\"/&gt;\n    &lt;ImportMap/&gt;\n    &lt;link rel=\"icon\" type=\"image/png\" href=\"favicon.png\"/&gt;\n    &lt;HeadOutlet/&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;Routes/&gt;\n&lt;ReconnectModal/&gt;\n&lt;script src=\"@Assets[\"_framework/blazor.web.js\"]\"&gt;&lt;/script&gt;\n&lt;script src=\"@Assets[\"Components/Account/Shared/PasskeySubmit.razor.js\"]\" type=\"module\"&gt;&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n```\n\n- The CSS-isolation (scoped `*.razor.css`) bundle is referenced as `@Assets[\"LuminaFeed.styles.css\"]` (App.razor:11) — the project's aggregated scoped-CSS file. So your new `Home.razor.css` / any new scoped CSS is automatically included; no extra wiring.\n- Assets go through the `@Assets[...]` helper (fingerprinted static assets). Follow that idiom for anything new.\n- `ResourcePreloader` (App.razor:8) is referenced but I could not find its definition in the source tree or csproj packages — appears to be an app-internal/generated head component that emits preload links; not relevant to B1/B2.\n- Global stylesheet `D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed\\wwwroot\\app.css` holds app-wide overrides (`.btn-primary`, focus rings, error boundary). Bootstrap CSS is loaded before it.\n\n## 6. Existing idioms to match\n\n**Native/`InputSelect` bound with `@bind`** — the only `&lt;select&gt;`-type control in the app is inside an `EditForm`, at `D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed\\Components\\Admin\\Feeds.razor:40-46`:\n\n```razor\n&lt;InputSelect id=\"feed-category\" @bind-Value=\"form.CategoryId\" class=\"form-select\"&gt;\n    &lt;option value=\"\"&gt;Select a category…&lt;/option&gt;\n    @foreach (var category in categories ?? [])\n    {\n        &lt;option value=\"@category.Id\"&gt;@category.Name&lt;/option&gt;\n    }\n&lt;/InputSelect&gt;\n```\n\nThere is **no** plain HTML `&lt;select @bind&gt;` example (only `InputSelect` inside forms). For B2's per-category header control — which is not inside an `EditForm` — the natural fit is a native `&lt;select class=\"form-select form-select-sm\" @bind=\"...\"` or `@onchange=\"...\"`, using the same `form-select` Bootstrap class. `@bind` on all the auth/admin forms uses `@bind-Value` because those are `Input*` components; a raw `&lt;select&gt;` would use `@bind`/`@onchange`.\n\n**No Blazor-driven dropdown/menu exists** anywhere — you'd be introducing the first one. The closest interactive show/hide idiom is the pure-CSS checkbox toggle in the nav (`NavMenu.razor:11` + `NavMenu.razor.css:104-110`), not a C#-state toggle.\n\n**`@onclick` + `EventCallback`**: only in `SubscribeButton.razor:8,12` (shown above) and the toggle handler `ToggleSubscriptionAsync` in Home. This is the pattern to copy for the B1 \"more\" button — a `&lt;button ... @onclick=\"...\"&gt;` incrementing a per-category visible count. Because `Home.razor` is `@rendermode InteractiveServer`, `@onclick` handlers auto-trigger a re-render; you do NOT need `StateHasChanged` for button clicks.\n\n**`StateHasChanged`**: used exactly once, `D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed\\Components\\Layout\\NavMenu.razor:74`, inside an external event handler (`NavigationManager.LocationChanged`) — i.e. only needed when state changes outside a Blazor UI event. Not needed for `@onclick`/`@bind`.\n\n**Icons**: there is **no icon font and no Bootstrap Icons package**. Icons are hand-rolled SVG data-URIs assigned to `.bi-*-nav-menu` classes in `D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed\\Components\\Layout\\NavMenu.razor.css:27-67` (e.g. `.bi { width:1.25rem; height:1.25rem; background-size:cover }` + `.bi-house-door-fill-nav-menu { background-image:url(\"data:image/svg+xml,...\") }`), used in markup as `&lt;span class=\"bi bi-house-door-fill-nav-menu\" aria-hidden=\"true\"&gt;&lt;/span&gt;` (`NavMenu.razor:17,24,33`). If B2's order control wants asc/desc arrows, follow this convention (inline SVG data-URI in scoped CSS, or an inline `&lt;svg&gt;`), or just use text like \"▲ / ▼\" — do not assume a `bi-*` icon-font glyph is available.\n\n## 7. Scoped-CSS files (styling convention)\n\nExactly four `*.razor.css` files exist:\n- `D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed\\Components\\Shared\\FeedCard.razor.css` (shown above)\n- `D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed\\Components\\Layout\\MainLayout.razor.css` (uses `::deep`, media queries at 640.98px / 641px breakpoints)\n- `D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed\\Components\\Layout\\NavMenu.razor.css`\n- `D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed\\Components\\Layout\\ReconnectModal.razor.css`\n\nConvention: plain class selectors scoped to the component (Blazor adds the `b-*` attribute automatically); use `::deep` to reach child-component / framework markup (as in `MainLayout.razor.css:24` `.top-row ::deep a`); `rem` units; responsive breakpoints match Bootstrap's `sm` boundary (~640px). A new `Home.razor.css` would be picked up automatically via the `LuminaFeed.styles.css` bundle already linked in `App.razor:11`.\n\n## Extra context relevant to B1/B2 ordering\n\n`Home.razor` currently renders all feeds per category (no cap) in a Bootstrap grid — `D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed\\Components\\Pages\\Home.razor:32-52`:\n\n```razor\n&lt;section class=\"mb-5\" @key=\"category.CategoryId\"&gt;\n    &lt;h2 class=\"h4 border-bottom pb-2 mb-3\"&gt;@category.CategoryName&lt;/h2&gt;\n    &lt;div class=\"row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-5 g-3\"&gt;\n        @foreach (var feed in category.Feeds)\n        {\n            &lt;div class=\"col\" @key=\"feed.Id\"&gt; &lt;FeedCard Feed=\"feed\"&gt; &lt;Actions&gt;...&lt;/Actions&gt; &lt;/FeedCard&gt; &lt;/div&gt;\n        }\n    &lt;/div&gt;\n&lt;/section&gt;\n```\n\nImportant for B1: the grid is already `row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-5` — i.e. **5 across only at `xl`, wrapping to fewer columns below**, which is close to your \"single row on desktop / wrap on mobile\" requirement (with 5-per-category, one row at xl). You'll adapt this while adding the visible-count cap and \"more\" button.\n\nDefault ordering (relevant to B2's \"popularity default\"): the service already returns feeds pre-sorted popularity-desc then name-asc — `D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed\\Services\\Feeds\\FeedService.cs:29-41`:\n\n```csharp\n.OrderBy(f =&gt; f.Category.Name)\n.ThenByDescending(f =&gt; f.Popularity)\n.ThenBy(f =&gt; f.Name)\n...\n// GroupBy keeps first-seen key order and element order, so the SQL ordering above carries through.\n```\n\nSo \"popularity, descending\" is the natural default and matches what `category.Feeds` already contains; B2's control would re-sort that in-memory list client-side (all needed fields — `Popularity`, `Name` — are on `FeedSummary`). The `IFeedService.ListByCategoryAsync` XML doc (IFeedService.cs:26-30) documents this contract: \"each with its feeds by popularity (highest first, then name).\"\n\n### Bottom line for your two decisions\n- **\"more\" button (B1):** copy the `SubscribeButton` idiom — a `&lt;button type=\"button\" class=\"btn btn-sm ...\" @onclick=\"...\"&gt;` that raises a per-category visible-count (e.g. `Dictionary&lt;Guid,int&gt;` keyed by `CategoryId`, start at 5, add 5). No JS, no `StateHasChanged` needed on `InteractiveServer`. Cap the `@foreach` with `.Take(visibleCount)`.\n- **order control (B2):** do NOT use a Bootstrap `data-bs-toggle=\"dropdown\"` — its JS isn't loaded. Use a native `&lt;select class=\"form-select form-select-sm\" @bind=\"...\"&gt;` (matching the `form-select` class from Admin/Feeds.razor) or a Blazor-state show/hide, and re-sort the category's feed list in C#. This is fully supported by the existing interactive circuit and no new dependencies are required.<\/result>\n<usage><subagent_tokens>61820<\/subagent_tokens><tool_uses>36<\/tool_uses><duration_ms>183339<\/duration_ms><\/usage>\n<\/task-notification>"}, {"kind": "response", "ts": "2026-09-22T08:44:15.607Z", "text": "Two agents done. The UI picture is clear:\n- **No Bootstrap JS** is loaded (only CSS 5.3.3) → the order control must be Blazor-driven, not a `data-bs-toggle` dropdown.\n- `@onclick`/`@bind` on the InteractiveServer circuit auto-rerender (no `StateHasChanged` needed).\n- Reusable idioms: `SubscribeButton`'s `@onclick`+`EventCallback` pattern for the \"More\" button; `form-select` class (from `Admin/Feeds.razor`) for a native `<select>`; scoped `Home.razor.css` is auto-bundled; icons are hand-rolled (no icon font).\n\nWaiting on the test-patterns agent before finalizing the test approach.", "thinking": "", "tools": []}, {"kind": "prompt", "cls": "typed", "ts": "2026-09-22T08:44:19.228Z", "text": "<task-notification>\n<task-id>a5357f35a0177a00d<\/task-id>\n<tool-use-id>toolu_01MNzsKSYbQabVYBHhYT3nqJ<\/tool-use-id>\n<output-file>C:\\Users\\thevi\\AppData\\Local\\Temp\\claude\\D--Work-Sonrisa-LuminaFeed-phase-2b\\da174833-2ffa-4cc3-8007-309fa75178c0\\tasks\\a5357f35a0177a00d.output<\/output-file>\n<status>completed<\/status>\n<summary>Agent \"Explore test patterns for public UI\" finished<\/summary>\n<note>A task-notification fires each time this agent stops with no live background children of its own. The user can send it another message and resume it, so the same task-id may notify more than once.<\/note>\n<result>I have everything needed. Here is the comprehensive report.\n\n---\n\n# LuminaFeed.Tests — testing patterns for B1 (card capping + \"more\") and B2 (order control)\n\nAll paths absolute. Test project: `D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed.Tests`. Framework: **.NET 10, xUnit 2.9.3, bUnit 2.11.3**. There is **no FluentAssertions** — everything uses plain xUnit `Assert.*` plus bUnit's AngleSharp-backed `Find`/`FindAll`.\n\nThere are two distinct test styles you will copy:\n- **Service tests** (fast, no host): `SqliteTestDatabase` directly → `new FeedService(...)`.\n- **bUnit component tests** (interactive render): `BunitContext` + `SqliteTestDatabase` + `SetRendererInfo`.\n- **Host smoke tests** (real `Program`): `TestAppFactory` + `[Collection(\"Host\")]` — asserts on raw prerendered HTML strings.\n\n---\n\n## 1. `FeedServiceTests` — structure, seeding, ordering/grouping\n\nFile: `D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed.Tests\\FeedServiceTests.cs`\n\n**Structure** (lines 8-23): a plain `sealed class ... : IDisposable`, no collection attribute (so it runs in parallel with other non-host classes). It owns one `SqliteTestDatabase` field and builds the service on demand:\n\n```csharp\npublic sealed class FeedServiceTests : IDisposable\n{\n    private readonly SqliteTestDatabase _db = new();                       // line 10\n    private FeedService CreateService() =&gt; new(_db, new CreateFeedRequestValidator());  // line 12\n    ...\n    public void Dispose() =&gt; _db.Dispose();                               // line 23\n```\n\nNote `_db` (the `SqliteTestDatabase`) **is** the `IDbContextFactory&lt;ApplicationDbContext&gt;` — it's passed straight into the service constructor. `CreateFeedRequestValidator` is the real FluentValidation validator.\n\n**Seeding** is done through the `SqliteTestDatabase` arrange-helpers, not raw EF (lines 156-176):\n\n```csharp\nvar weather = _db.AddCategory(\"Weather\");\nvar markets = _db.AddCategory(\"Markets\");\n_db.AddFeed(weather.Id, \"NOAA\", popularity: 10);\n_db.AddFeed(weather.Id, \"Met Office\", popularity: 500);\n_db.AddFeed(weather.Id, \"AccuWeather\", popularity: 10);\n_db.AddFeed(markets.Id, \"Reuters Markets\", popularity: 1);\n```\n\n**The representative ordering/grouping test** — this is the one closest to what B2 (order control) will extend. `ListByCategoryTests_GroupsByCategoryName_WithFeedsByPopularityDescending` (lines 168-186):\n\n```csharp\n[Fact]\npublic async Task ListByCategoryAsync_GroupsByCategoryName_WithFeedsByPopularityDescending()\n{\n    var weather = _db.AddCategory(\"Weather\");\n    var markets = _db.AddCategory(\"Markets\");\n    _db.AddFeed(weather.Id, \"NOAA\", popularity: 10);\n    _db.AddFeed(weather.Id, \"Met Office\", popularity: 500);\n    _db.AddFeed(weather.Id, \"AccuWeather\", popularity: 10);\n    _db.AddFeed(markets.Id, \"Reuters Markets\", popularity: 1);\n\n    var groups = await CreateService().ListByCategoryAsync();\n\n    Assert.Equal([\"Markets\", \"Weather\"], groups.Select(g =&gt; g.CategoryName));\n    Assert.Equal(markets.Id, groups[0].CategoryId);\n    Assert.Equal([\"Reuters Markets\"], groups[0].Feeds.Select(f =&gt; f.Name));\n    // Popularity first (highest wins); name breaks the tie between the two 10s.\n    Assert.Equal([\"Met Office\", \"AccuWeather\", \"NOAA\"], groups[1].Feeds.Select(f =&gt; f.Name));\n    Assert.All(groups[1].Feeds, f =&gt; Assert.Equal(\"Weather\", f.CategoryName));\n}\n```\n\nThe ordering assertion idiom is `Assert.Equal([...expected names...], groups[i].Feeds.Select(f =&gt; f.Name))` — a collection-equality check on the projected sequence. Companion edge-case tests you should mirror: `ListByCategoryAsync_OmitsCategoriesWithoutFeeds` (189-198) and `ListByCategoryAsync_EmptyCatalogue_ReturnsEmpty` (201-204).\n\nThe service under test — `D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed\\Services\\Feeds\\FeedService.cs` lines 26-42 — currently orders `OrderBy(Category.Name).ThenByDescending(Popularity).ThenBy(Name)` and groups in-memory (comment at line 38: \"GroupBy keeps first-seen key order and element order, so the SQL ordering above carries through\"). The model records are in `IFeedService.cs` lines 6-18: `FeedSummary(Id, Name, CategoryId, CategoryName, FeedUrl, SiteUrl, ImageUrl, Description, Popularity)` and `CategoryFeeds(CategoryId, CategoryName, IReadOnlyList&lt;FeedSummary&gt; Feeds)`.\n\nFor **B2** you'll add a sort-mode parameter (popularity/name × asc/desc) to `ListByCategoryAsync` and add `[Theory]` cases asserting the four orderings via the same `Assert.Equal([...], g.Feeds.Select(f =&gt; f.Name))` pattern. Note the \"max 5 per category\" cap for B1 is *not* currently in the service — decide whether capping lives in the service (test here) or the component (test in bUnit).\n\n---\n\n## 2. `PublicPagesTests` — host boot + the payload-size guard\n\nFile: `D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed.Tests\\PublicPagesTests.cs`\n\n**Boots the real host** via `TestAppFactory` (a `WebApplicationFactory&lt;Program&gt;`) and joins the Host collection (lines 13-22):\n\n```csharp\n[Collection(HostCollection.Name)]\npublic sealed class PublicPagesTests\n{\n    private static readonly int SeededFeeds = SeedCatalogLoader.LoadEmbedded().Feeds.Count;  // line 17\n    ...\n    using var factory = new TestAppFactory();\n    using var client = factory.CreateClient();\n    using var response = await client.GetAsync(\"/\");\n    var html = await response.Content.ReadAsStringAsync();\n```\n\n**Asserts on `/` HTML** as raw strings. Cards are counted by a marker class string (line 32); this is the exact hook B1's capping test can reuse:\n\n```csharp\n// Every seeded feed gets a card.\nAssert.Equal(SeededFeeds, CountOf(html, \"class=\\\"card h-100 feed-card\\\"\"));\n```\n\n`CountOf` is a substring counter (line 127): `private static int CountOf(string html, string fragment) =&gt; html.Split(fragment).Length - 1;`. Subscribe/Unsubscribe buttons are counted the same way, e.g. `CountOf(html, \"&gt;Subscribe&lt;/a&gt;\")` (line 67), `CountOf(html, \"btn-danger\")` (line 69).\n\n**The \"keep persisted payload under 8 KB\" / circuit-start payload test.** There are two parts. The budget constant with the rationale (lines 99-104):\n\n```csharp\n/// Persisted component state is embedded in the page and sent back to the server inside the circuit-start\n/// message, which SignalR rejects above 32 KB ... Persisting the whole catalogue produced ~87 KB ... Keep it small.\nprivate const int PersistedStateBudget = 8 * 1024;\n```\n\nThe dedicated test (lines 106-115):\n\n```csharp\n[Fact]\npublic async Task Home_PersistedState_StaysFarBelowTheCircuitMessageLimit()\n{\n    using var factory = new TestAppFactory();\n    using var client = factory.CreateClient();\n\n    var html = await client.GetStringAsync(\"/\");\n\n    Assert.InRange(PersistedStateBytes(html), 0, PersistedStateBudget);\n}\n```\n\nAnd how it **measures payload size** — it locates the Blazor persisted-state HTML comment and measures the byte span between the marker and `--&gt;` (lines 117-125):\n\n```csharp\nprivate static int PersistedStateBytes(string html)\n{\n    const string start = \"&lt;!--Blazor-Server-Component-State:\";\n    var from = html.IndexOf(start, StringComparison.Ordinal);\n    if (from &lt; 0)\n        return 0;\n    var to = html.IndexOf(\"--&gt;\", from, StringComparison.Ordinal);\n    return to - from - start.Length;\n}\n```\n\nThe signed-in variant additionally asserts `Assert.Contains(\"Blazor-Server-Component-State\", html)` and `Assert.InRange(PersistedStateBytes(html), 1, PersistedStateBudget)` (lines 95-96). This guard matters for B1/B2: the `Home` page persists only subscribed ids (`[PersistentState] HashSet&lt;Guid&gt;? SubscribedIds`, `Home.razor` line 70), and deliberately does **not** persist the catalogue (comment lines 63-66). If your \"more\" state or sort selection gets marked `[PersistentState]`, add/extend a payload-size assertion so you don't blow the circuit budget.\n\n`SeededFeeds` comes from `SeedCatalogLoader.LoadEmbedded().Feeds.Count` (line 17) — expected counts are derived from the embedded catalogue, so B1's capping test should compute expected capped counts from real seed data rather than hard-coding.\n\n---\n\n## 3. bUnit component tests — the pattern to copy for \"more\" and order control\n\nTwo files. The **subscribe-button** interactive test is the closest analogue for your \"more\" button; the **admin form** test is the closest analogue for an order-control `&lt;select&gt;`.\n\n### 3a. `HomePageComponentTests` (subscribe button — copy this for the \"more\" button)\n\nFile: `D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed.Tests\\HomePageComponentTests.cs`\n\n**Class + service registration on the test DB** (lines 21-30). Note it derives from `BunitContext` and registers the *real* services against `SqliteTestDatabase` via bUnit's `Services` container:\n\n```csharp\npublic sealed class HomePageComponentTests : BunitContext\n{\n    private readonly SqliteTestDatabase _db = new();\n    private readonly Feed _feed;\n\n    public HomePageComponentTests()\n    {\n        Services.AddSingleton&lt;IFeedService&gt;(new FeedService(_db, new CreateFeedRequestValidator()));\n        _feed = _db.AddFeed(_db.AddCategory(\"World News\").Id, \"BBC News\");\n    }\n```\n\n**`SetRendererInfo` for `@rendermode InteractiveServer`** — this is the critical bit for testing anything on `Home` (which declares `@rendermode InteractiveServer`, `Home.razor` line 2). It must be the *last* setup step because it locks the service container (lines 32-40):\n\n```csharp\n/// Renders the page as an interactive server renderer would (it declares @rendermode InteractiveServer).\n/// Setting the renderer info locks bUnit's service container, so it happens last.\nprivate IRenderedComponent&lt;Home&gt; RenderHome()\n{\n    SetRendererInfo(new RendererInfo(\"Server\", isInteractive: true));\n    return Render&lt;Home&gt;();\n}\n```\n\n(`Render&lt;T&gt;()` is bUnit v2's rename of `RenderComponent&lt;T&gt;`. `IRenderedComponent&lt;T&gt;` is the CUT handle.)\n\n**Auth setup** uses bUnit's `AddAuthorization()` fake auth provider, wiring the `NameIdentifier` claim that `Home.OnInitializedAsync` reads (lines 52-57, 65-66):\n\n```csharp\nprivate ApplicationUser SignInAs(string email)\n{\n    var user = _db.AddUser(email);\n    AddAuthorization().SetAuthorized(email).SetClaims(new Claim(ClaimTypes.NameIdentifier, user.Id));\n    return user;\n}\n// anonymous:\nAddAuthorization().SetNotAuthorized();\n```\n\n**Disposal** overrides `Dispose(bool)` and disposes the db after base (lines 42-47):\n\n```csharp\nprotected override void Dispose(bool disposing)\n{\n    base.Dispose(disposing);\n    if (disposing)\n        _db.Dispose();\n}\n```\n\n**A full representative interactive test — click, re-render, DB assertion** (lines 76-100). This is the template for the \"more\" button (click → assert 5 more cards appear) and the order control (change → assert reordered markup):\n\n```csharp\n[Fact]\npublic async Task SignedIn_ClickingSubscribe_TurnsItIntoRedUnsubscribe_AndPersistsTheSubscription()\n{\n    UseSubscriptions();\n    var alice = SignInAs(\"alice@example.test\");\n\n    var cut = RenderHome();\n    var button = cut.WaitForElement(SubscribeButton);\n    Assert.Contains(\"btn-primary\", button.ClassList);\n\n    await button.ClickAsync(new MouseEventArgs());\n\n    cut.WaitForAssertion(() =&gt;\n    {\n        var toggled = cut.Find(UnsubscribeButton);\n        Assert.Contains(\"btn-danger\", toggled.ClassList);\n        Assert.False(toggled.HasAttribute(\"disabled\"));\n    });\n    Assert.Empty(cut.FindAll(\".alert-danger\"));\n    using var ctx = _db.CreateDbContext();\n    var row = Assert.Single(ctx.Subscriptions);\n    Assert.Equal(alice.Id, row.UserId);\n    Assert.Equal(_feed.Id, row.FeedId);\n    Assert.True(row.EmailEnabled);\n}\n```\n\nKey interaction idioms you will reuse:\n- Elements selected by CSS selector, esp. `aria-label` (lines 59-60): `\"button[aria-label='Subscribe to BBC News']\"`.\n- `cut.WaitForElement(selector)` to get an element once it renders; `cut.Find(selector)` for a single element; `cut.FindAll(selector)` returns a list (use `Assert.Empty` / `.Count`).\n- `await element.ClickAsync(new MouseEventArgs())` to fire `@onclick`. For a `&lt;select&gt;` order control, use `element.Change(\"value\")` (see admin form below).\n- `cut.WaitForAssertion(() =&gt; ...)` to poll until an async re-render settles — **always** wrap post-interaction assertions in this for InteractiveServer components.\n- Assert markup via `element.ClassList` (`Assert.Contains(\"btn-danger\", ...)`), `element.HasAttribute(\"disabled\")`, `element.TextContent`, `element.GetAttribute(\"href\")`, and `cut.Markup` for whole-render substring checks.\n\nThe busy-gate test (lines 123-139) shows how to prove the in-flight disabled state using a `GatedSubscriptionService` test double (lines 158-175) that parks the call on a `TaskCompletionSource` until `Release()`. Copy this if your \"more\"/sort handlers do async work you want to gate. The failure test (141-155) asserts `.alert-danger` via `ErrorList`.\n\n### 3b. `AdminFormsComponentTests` (form/`&lt;select&gt;` — copy this for the order-control dropdown)\n\nFile: `D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed.Tests\\AdminFormsComponentTests.cs`\n\nSame shape: `: BunitContext`, real services on `SqliteTestDatabase` (lines 16-24), a generic `RenderPage&lt;TPage&gt;()` helper that calls `SetRendererInfo(new RendererInfo(\"Server\", isInteractive: true))` then `Render&lt;TPage&gt;()` (lines 30-34). This shows **`&lt;select&gt;` interaction via `.Change(value)`** and **submit** (lines 98-124):\n\n```csharp\ncut.Find(\"#feed-category\").Change(category.Id.ToString());\ncut.Find(\"#feed-name\").Change(\"Nature\");\ncut.Find(\"#feed-url\").Change(\"https://www.nature.com/nature.rss\");\ncut.Find(\"#feed-popularity\").Change(\"42\");\nawait cut.Find(\"form\").SubmitAsync();\n\ncut.WaitForAssertion(() =&gt; Assert.Contains(\"Feed \\\"Nature\\\" was added.\", cut.Find(\".alert-success\").TextContent));\nvar row = cut.Find(\"tbody tr\");\nAssert.Contains(\"Science\", row.TextContent);\n// the category stays selected for the next feed:\nAssert.Equal(category.Id.ToString(), cut.Find(\"#feed-category\").GetAttribute(\"value\"));\n```\n\nFor **B2's order-control `&lt;select&gt;`**: `cut.Find(\"#order-select\").Change(\"name-asc\")` then `cut.WaitForAssertion(() =&gt; Assert.Equal([...], cut.FindAll(\".feed-card h3.card-title\").Select(e =&gt; e.TextContent)))` to verify the reorder. `FindAll` + `Select` on rendered elements is the DOM-order assertion idiom.\n\nThe relevant components you'll extend live at:\n- `D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed\\Components\\Pages\\Home.razor` — the grid is `row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-5 g-3` (line 34): that Bootstrap class set is already your \"single row on wide desktop (xl:5), wrap on mobile\" behaviour, so B1's layout assertions can check for those classes.\n- `D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed\\Components\\Shared\\FeedCard.razor` — card markup, `class=\"card h-100 feed-card\"` (line 4), title in `h3.card-title.h6` (line 10).\n- `D:\\Work\\Sonrisa\\LuminaFeed-phase-2b\\LuminaFeed\\Components\\Shared\\SubscribeButton.razor` — button/link markup with `aria-label` (lines 4, 8, 12).\n\n---\n\n## 4. Test infrastructure — where each lives, what to reuse\n\n| Component | File | What it provides |\n|---|---|---|\n| `SqliteTestDatabase` | `...\\LuminaFeed.Tests\\SqliteTestDatabase.cs` | `internal sealed` class implementing `IDbContextFactory&lt;ApplicationDbContext&gt;` + `IDisposable`. In-memory SQLite with one kept-open connection (`DataSource=:memory:`, ctor lines 17-23) so all contexts share data. `CreateDbContext()` (line 25). Arrange helpers: `AddCategory(name, description)` (32), `AddFeed(categoryId, name, feedUrl, popularity)` (41), `AddUser(email)` (57). **Reuse directly** in service tests and bUnit tests. |\n| `TestAppFactory` | `...\\LuminaFeed.Tests\\TestAppFactory.cs` | `internal sealed : WebApplicationFactory&lt;Program&gt;`. Boots real `Program` against an isolated temp SQLite file (`_dbPath`, line 33). Ctor flags: `validUnsubscribe`, `seedAdmin`, `hostPollingLoop`, `configureServices` (43-56). Constants `AdminEmail`/`AdminPassword` (24-25). Swaps in `NoNetworkFeedFetcher` + `RecordingMailSender`, removes the polling hosted service by default (90-104). Cleans up the db file on dispose (109-126). |\n| `HostCollection` | `...\\LuminaFeed.Tests\\TestAppFactory.cs` lines 130-134 | `[CollectionDefinition(\"Host\")]` with `public const string Name = \"Host\"`. |\n| `BunitContext` | **bUnit library** (package `bunit` 2.11.3, `LuminaFeed.Tests.csproj` line 11) — *not* a project file | bUnit v2's base test class (v1's `TestContext`). Provides `Services` (DI), `Render&lt;T&gt;()`, `SetRendererInfo(...)`, `AddAuthorization()`, and the `IRenderedComponent&lt;T&gt;` API (`Find`, `FindAll`, `WaitForElement`, `WaitForAssertion`, `Markup`). |\n| `TestSignIn` | `...\\LuminaFeed.Tests\\TestSignIn.cs` | `internal static partial class`. `SignInAsync(client, email, password)` (24-43) posts the real Identity login form with its antiforgery token (scraped via `GeneratedRegex`, lines 9-18) and verifies the auth cookie by loading `/Account/Manage`. Requires `AllowAutoRedirect = false`. Used by host tests, not bUnit tests. |\n| `TestDoubles.cs` | `...\\LuminaFeed.Tests\\TestDoubles.cs` | `ListLogger&lt;T&gt;` (captures log entries, 7-16) and `RecordingMailSender : IMailSender` (records/optionally fails email, thread-safe, 19-39). Polling-specific doubles (`NoNetworkFeedFetcher`) live separately in `PollingTestDoubles.cs`. |\n\n---\n\n## 5. How markup is asserted\n\n**Plain xUnit `Assert.*` only — no FluentAssertions** (grep for `FluentAssertions`/`.Should()` returned nothing; not referenced in the `.csproj`). Two layers:\n\n- **Host tests (`PublicPagesTests`)**: raw HTML *string* matching — `Assert.Contains(\"BBC News\", html)`, `Assert.DoesNotContain(...)`, and the substring counter `CountOf(html, \"...\")` for occurrence counts.\n- **bUnit tests**: **AngleSharp** DOM via bUnit's `Find`/`FindAll` (CSS selectors), then xUnit assertions on element members: `element.ClassList` (`Assert.Contains(\"btn-danger\", ...)`), `element.HasAttribute(\"disabled\")`, `element.TextContent`, `element.GetAttribute(\"value\"|\"href\")`, `cut.Markup` for whole-render substring checks, `cut.FindAll(selector)` + `Assert.Empty`/`.Count`/`.Select(...)` for collections. Async settling via `cut.WaitForAssertion(...)` and `cut.WaitForElement(...)`.\n\n---\n\n## 6. `[Collection(\"Host\")]` convention &amp; DB isolation\n\nThe convention is defined once in `TestAppFactory.cs` (lines 129-134):\n\n```csharp\n[CollectionDefinition(Name)]\npublic sealed class HostCollection { public const string Name = \"Host\"; }\n```\n\n**Why it exists** (TestAppFactory doc-comment, lines 17-21): the SQLite connection string is handed to `Program` through the **process-wide environment variable** `ConnectionStrings__DefaultConnection` (set in ctor line 55, cleared on dispose line 117). Because that env var is global, two host-booting factories running concurrently would clobber each other — so every class that boots the real host must join the collection to be **serialized**.\n\n**Classes in the Host collection** (all carry `[Collection(HostCollection.Name)]`): `PublicPagesTests` (line 13), `AdminPagesTests` (14), `HostBootTests` (24), `RegistrationFlowTests` (16), `WalkingSkeletonTests` (20).\n\n**DB isolation is two-tier:**\n- *Host tests*: each `TestAppFactory` instance gets a **unique temp file** — `luminafeed-test-{Guid.NewGuid():N}.db` next to the test binaries (line 33) — created fresh per factory and deleted on dispose (with SQLite pool clearing + `-shm`/`-wal` cleanup, lines 121-125). One `using var factory = new TestAppFactory()` per test = a private database.\n- *Service &amp; bUnit tests* (`FeedServiceTests`, `HomePageComponentTests`, `AdminFormsComponentTests`): **no** collection attribute, so they run in parallel; isolation comes from each test-class instance owning its own `new SqliteTestDatabase()` (a private in-memory connection), disposed in `Dispose`. xUnit news up a fresh instance per test method, so every test gets a clean in-memory DB.\n\n**Takeaway for your new tests:** B1/B2 service tests → copy `FeedServiceTests` (own `SqliteTestDatabase`, no collection). \"More\" button + order-control interaction tests → copy `H
